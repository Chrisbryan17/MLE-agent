name: LiveBench Spatial Inputs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'research/universal_validation/livebench_spatial_inputs.py'
      - '.github/workflows/livebench-spatial-inputs.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-validation-clean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check --quiet pyarrow
      - name: Export unlabeled spatial inputs
        working-directory: research/universal_validation
        run: |
          mkdir -p artifacts/livebench_spatial_inputs
          python -m py_compile livebench_spatial_inputs.py
          python livebench_spatial_inputs.py 2>&1 | tee artifacts/livebench_spatial_inputs/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: universal-validation-livebench-spatial-inputs
          path: |
            research/universal_validation/artifacts/livebench_spatial_inputs/**
            research/universal_validation/livebench_spatial_inputs.py
          if-no-files-found: error
