name: Public Benchmark Adapters

on:
  push:
    branches:
      - universal-core-public-benchmark-adapters-v1
    paths:
      - '.github/workflows/public-benchmark-adapters.yml'
      - 'research/universal_core/public_benchmarks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-public-benchmark-adapters-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Run benchmark adapter tests
        run: python -m pytest -q research/universal_core/public_benchmarks/tests
      - name: Run frozen V2 integration cluster
        run: >-
          python -m pytest -q
          research/universal_core/holonomy_v2/tests/test_blind_adapter.py
          research/universal_core/holonomy_v2/tests/test_engine.py
