name: ARC Axis Collapse RED

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-axis-collapse-red.yml'

permissions:
  contents: write

jobs:
  verify-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pytest
      - run: python -m pytest -q research/universal_core/holonomy_v2_2/tests/test_axis_collapse_fixtures.py
      - name: Require missing axis module
        run: |
          set +e
          python -m pytest -q research/universal_core/holonomy_v2_2/tests/test_axis_collapse.py > /tmp/axis-red.log 2>&1
          status=$?
          set -e
          cat /tmp/axis-red.log
          test "$status" -ne 0
          grep -F "No module named 'research.universal_core.holonomy_v2_2.axis_collapse'" /tmp/axis-red.log
      - name: Commit RED evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'schema_version': 1,
              'source_commit': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'failure_confirmed': True,
              'fixture_integrity': True,
              'expected_failure': "ModuleNotFoundError: No module named 'research.universal_core.holonomy_v2_2.axis_collapse'",
              'expected_new_exact_tasks': [
                  '2dee498d', '746b3537', '7b7f7511', 'ce8d95cc', 'e1baa8a4', 'eb5a1d5d'
              ],
              'training_scan': {
                  'compatible_tasks': 6,
                  'wrong_completed_hidden_outputs': 0,
                  'ambiguous_hidden_outputs': 0,
                  'compatible_accepted_tasks': 0,
              },
              'captured_log': Path('/tmp/axis-red.log').read_text(encoding='utf-8'),
              'frozen_core_commit': '1d7c489bcdbff755d638b35ad47ce62bd4fe829d',
              'public_arc_evaluation_rerun': False,
          }
          path = Path('research/universal_core/holonomy_v2_2/evidence/AXIS_COLLAPSE_RED.json')
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2_2/evidence/AXIS_COLLAPSE_RED.json
          git commit -m 'arc: record axis collapse RED evidence'
          git push origin HEAD:universal-core-arc-training-v2-2
