name: Universal Semantic Evaluation

on:
  pull_request:
    branches:
      - universal-validation-clean
    paths:
      - 'research/universal_validation/bbeh_semantic_jury.py'
      - '.github/workflows/universal-semantic-eval.yml'

permissions:
  contents: read
  models: read

jobs:
  bbeh-semantic-jury:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-semantic-eval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned BBEH
        run: |
          mkdir -p research/universal_validation/.external
          git clone https://github.com/google-deepmind/bbeh.git research/universal_validation/.external/bbeh
          git -C research/universal_validation/.external/bbeh checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
      - name: Run frozen semantic jury
        working-directory: research/universal_validation
        env:
          BBEH_ROOT: .external/bbeh
          BBEH_JURY_MODEL: openai/o4-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/bbeh_semantic_jury
          python -m py_compile bbeh_semantic_jury.py
          python bbeh_semantic_jury.py 2>&1 | tee artifacts/bbeh_semantic_jury/run.log
      - name: Hash evidence
        working-directory: research/universal_validation
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, platform, sys
          root = pathlib.Path('artifacts/bbeh_semantic_jury')
          payload = {
              'python': sys.version,
              'platform': platform.platform(),
              'code_sha256': hashlib.sha256(pathlib.Path('bbeh_semantic_jury.py').read_bytes()).hexdigest(),
              'evidence_sha256': {
                  str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()
              },
          }
          (root / 'reproducibility.json').write_text(json.dumps(payload, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-bbeh-semantic-jury
          path: |
            research/universal_validation/artifacts/bbeh_semantic_jury/**
            research/universal_validation/bbeh_semantic_jury.py
          if-no-files-found: error
