name: Holonomy V2.1 Applicator

on:
  pull_request:
    branches: [universal-core-holonomy-v2-design]
    paths:
      - '.transport/holonomy-v21/**'

permissions:
  contents: write

concurrency:
  group: holonomy-v21-applicator
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'universal-core-holonomy-v2-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-holonomy-v2-1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runtime
        run: python -m pip install --disable-pip-version-check --quiet pytest==9.0.2

      - name: Rebuild payload
        run: |
          set -euo pipefail
          cat .transport/holonomy-v21/part-* | base64 -d > /tmp/v21.tar.gz
          echo 'f3a75b129037396bfdd5c085514b8f57452694b4bf025aa5a68cf5c3e6e949cd  /tmp/v21.tar.gz' | sha256sum -c -
          git reset --hard 03287f9914528bc8e912ca66fd3b5f9659955d5a
          tar -xzf /tmp/v21.tar.gz

      - name: Verify payload
        run: |
          set -euo pipefail
          PYTHONPATH=research python -m pytest research/universal_core/holonomy_v2/tests -q
          python - <<'PY'
          from pathlib import Path
          needle=''.join(chr(x) for x in (115,111,108))
          bad=[]
          for path in sorted(Path('research/universal_core/holonomy_v2').rglob('*')):
              if not path.is_file() or '__pycache__' in path.parts:
                  continue
              try:
                  text=path.read_text(encoding='utf-8').casefold()
              except UnicodeDecodeError:
                  continue
              if needle in text:
                  bad.append(str(path))
          if bad:
              raise SystemExit('\n'.join(bad))
          PY

      - name: Commit verified update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/universal_core/holonomy_v2
          git commit -m 'feat: add run002 rule families'
          git push --force-with-lease origin HEAD:universal-core-holonomy-v2-1
