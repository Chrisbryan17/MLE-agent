name: Universal Final Documents V2

on:
  pull_request:
    branches:
      - universal-validation-clean
    paths:
      - 'research/universal_validation/document_end_to_end_eval_v2.py'
      - 'research/universal_validation/FINAL_DOCUMENT_V2_RUN.txt'
      - '.github/workflows/universal-final-documents-v2.yml'

permissions:
  contents: read
  models: read

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evaluation dependencies
        run: python -m pip install --disable-pip-version-check --quiet pyarrow
      - name: Run class-label-safe document suite
        working-directory: research/universal_validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENT_JURY_MODEL: openai/o4-mini
          DOCUMENT_SAMPLE_SIZE: '100'
        run: |
          set -euxo pipefail
          mkdir -p artifacts/document_end_to_end
          python -m py_compile document_end_to_end_eval.py document_end_to_end_eval_v2.py
          python document_end_to_end_eval_v2.py 2>&1 | tee artifacts/document_end_to_end/run.log
      - name: Hash complete evidence
        working-directory: research/universal_validation
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, platform, sys
          root = pathlib.Path('artifacts/document_end_to_end')
          payload = {
              'python': sys.version,
              'platform': platform.platform(),
              'code_sha256': {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in (pathlib.Path('document_end_to_end_eval.py'), pathlib.Path('document_end_to_end_eval_v2.py'))
              },
              'evidence_sha256': {
                  str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(root.rglob('*')) if path.is_file()
              },
          }
          (root / 'reproducibility.json').write_text(json.dumps(payload, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-final-document-results-v2
          path: |
            research/universal_validation/artifacts/document_end_to_end/**
            research/universal_validation/document_end_to_end_eval.py
            research/universal_validation/document_end_to_end_eval_v2.py
          if-no-files-found: error
