name: ARC Symmetry Complete Module GREEN

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-symmetry-complete-module-green.yml'

permissions:
  contents: write

jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Run isolated symmetry tests
        run: |
          python -m pytest -q \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete.py::test_vertical_completion_reflects_columns \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete.py::test_horizontal_completion_reflects_rows \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete.py::test_rotate_180_completion_preserves_original_cells \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete.py::test_diagonal_completion_uses_original_anchors_only \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete.py::test_symmetry_completion_rejects_cross_color_overwrite \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete.py::test_diagonal_completion_rejects_non_square_grid \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete.py::test_program_derivation_returns_unique_horizontal_candidate \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete.py::test_program_derivation_rejects_shape_change \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete.py::test_program_derivation_skips_noop_demonstration \
            | tee /tmp/symmetry-module-green.log
      - name: Confirm frozen bytes
        run: git diff --quiet 1d7c489bcdbff755d638b35ad47ce62bd4fe829d -- research/universal_core/holonomy_v2
      - name: Commit module evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'schema_version': 1,
              'source_commit': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'passed': True,
              'test_count': 10,
              'test_output': Path('/tmp/symmetry-module-green.log').read_text(encoding='utf-8'),
              'expected_new_exact_tasks': ['496994bd', 'e729b7be', 'f25ffba3'],
              'expected_new_ambiguous_tasks': ['b8825c91'],
              'frozen_core_commit': '1d7c489bcdbff755d638b35ad47ce62bd4fe829d',
              'frozen_byte_gate': True,
              'public_arc_evaluation_rerun': False,
          }
          path = Path('research/universal_core/holonomy_v2_2/evidence/SYMMETRY_COMPLETE_MODULE_GREEN.json')
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2_2/evidence/SYMMETRY_COMPLETE_MODULE_GREEN.json
          git commit -m 'arc: record symmetry completion module GREEN'
          git push origin HEAD:universal-core-arc-training-v2-2
