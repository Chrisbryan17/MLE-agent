name: Universal Document Evaluation

on:
  pull_request:
    branches:
      - universal-validation-clean
    paths:
      - 'research/universal_validation/document_dataset_inventory.py'
      - '.github/workflows/universal-doc-eval.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-doc-eval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dataset tooling
        run: python -m pip install --disable-pip-version-check --quiet datasets pyarrow
      - name: Inventory frozen real-document suite
        working-directory: research/universal_validation
        run: |
          mkdir -p artifacts/document_inventory
          python -m py_compile document_dataset_inventory.py
          python document_dataset_inventory.py 2>&1 | tee artifacts/document_inventory/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-document-inventory
          path: |
            research/universal_validation/artifacts/document_inventory/**
            research/universal_validation/document_dataset_inventory.py
          if-no-files-found: error
