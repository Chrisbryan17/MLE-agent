name: Universal Document Evaluation

on:
  pull_request:
    branches:
      - universal-validation-clean
    paths:
      - 'research/universal_validation/document_dataset_inventory*.py'
      - '.github/workflows/universal-doc-eval.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-doc-eval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dataset tooling
        run: python -m pip install --disable-pip-version-check --quiet pyarrow
      - name: Inventory official Parquet exports
        working-directory: research/universal_validation
        run: |
          mkdir -p artifacts/document_inventory_v2
          python -m py_compile document_dataset_inventory_v2.py
          python document_dataset_inventory_v2.py 2>&1 | tee artifacts/document_inventory_v2/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-document-inventory-v2
          path: |
            research/universal_validation/artifacts/document_inventory_v2/**
            research/universal_validation/document_dataset_inventory_v2.py
          if-no-files-found: error
