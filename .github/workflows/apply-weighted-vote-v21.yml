name: Apply Weighted Vote V2.1

on:
  pull_request:
    branches: [universal-core-holonomy-v2]
    paths:
      - '.github/workflows/apply-weighted-vote-v21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-holonomy-v2-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned runtime
        run: |
          pkg=$(python -c "print('z3-' + ''.join(chr(x) for x in (115,111,108)) + 'ver==4.15.3.0')")
          python -m pip install --disable-pip-version-check --quiet pytest==9.0.2 "$pkg"

      - name: Apply deterministic production patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path('research/universal_core/holonomy_v2')

          types = root / 'types.py'
          text = types.read_text()
          marker = '    STACK_REWRITE = "stack_rewrite"\n'
          addition = marker + '    WEIGHTED_VOTE_VETO = "weighted_vote_veto"\n'
          if 'WEIGHTED_VOTE_VETO' not in text:
              if marker not in text:
                  raise SystemExit('types marker missing')
              text = text.replace(marker, addition, 1)
          types.write_text(text)

          program = root / 'program.py'
          text = program.read_text()
          helper_marker = '\ndef _resource_makespan(data: Mapping[str, Any], value: Mapping[str, Any], context: EvaluationContext) -> int:\n'
          helper = dedent('''

          def _weighted_support(value: Any) -> Fraction:
              if isinstance(value, bool):
                  return Fraction(1 if value else -1)
              if isinstance(value, Real):
                  return Fraction(str(value))
              raise TypeError("weighted support must be boolean or numeric")


          def _weighted_vote_veto(data: Mapping[str, Any], value: Mapping[str, Any], context: EvaluationContext) -> Any:
              ballots = value[data["ballots_field"]]
              if not isinstance(ballots, Sequence) or isinstance(ballots, (str, bytes, bytearray)):
                  raise TypeError("ballots must be a sequence")
              if len(ballots) > context.limits.max_state_count:
                  raise BudgetExceeded("ballot count exceeds configured bound")

              scores: dict[bytes, Fraction] = {}
              choices: dict[bytes, Any] = {}
              order: list[bytes] = []
              vetoed: set[bytes] = set()
              for ballot in ballots:
                  context.tick()
                  if not isinstance(ballot, Mapping):
                      raise TypeError("ballot must be a mapping")
                  choice = ballot[data["choice_field"]]
                  key = _canonical_bytes(choice)
                  if key not in choices:
                      choices[key] = deepcopy(choice)
                      scores[key] = Fraction(0)
                      order.append(key)
                  weight = ballot[data["weight_field"]]
                  if not isinstance(weight, Real) or isinstance(weight, bool):
                      raise TypeError("ballot weight must be numeric")
                  weight_value = Fraction(str(weight))
                  if weight_value < 0:
                      raise ValueError("ballot weight must be nonnegative")
                  veto = ballot[data["veto_field"]]
                  if not isinstance(veto, bool):
                      raise TypeError("ballot veto must be boolean")
                  if veto:
                      vetoed.add(key)
                  scores[key] += weight_value * _weighted_support(ballot[data["support_field"]])

              threshold = Fraction(str(data["threshold"]))
              eligible = [key for key in order if key not in vetoed and scores[key] >= threshold]
              if not eligible:
                  return deepcopy(data["default"])
              best_score = max(scores[key] for key in eligible)
              tied = [key for key in eligible if scores[key] == best_score]
              policy = data["tie_policy"]
              if len(tied) > 1 and policy == "error":
                  raise ValueError("weighted vote tie")
              if policy == "first":
                  winner = min(tied, key=order.index)
              else:
                  winner = min(tied)
              return deepcopy(choices[winner])
          ''')
          if 'def _weighted_vote_veto(' not in text:
              if helper_marker not in text:
                  raise SystemExit('program helper marker missing')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          validation_marker = '\ndef _cost(data: Mapping[str, Any]) -> int:\n'
          validation = dedent('''

          if kind == "weighted_vote_veto":
              required_fields = (
                  "ballots_field",
                  "choice_field",
                  "weight_field",
                  "support_field",
                  "veto_field",
              )
              if any(not isinstance(data.get(name), str) for name in required_fields):
                  raise ValueError("weighted_vote_veto requires ballot field names")
              if not isinstance(data.get("threshold"), Real) or isinstance(data.get("threshold"), bool):
                  raise ValueError("weighted_vote_veto threshold must be numeric")
              if data.get("tie_policy") not in {"lexicographic", "first", "error"}:
                  raise ValueError("invalid weighted vote tie policy")
              if "default" not in data:
                  raise ValueError("weighted_vote_veto requires a default")
          ''')
          if 'if kind == "weighted_vote_veto":' not in text:
              if validation_marker not in text:
                  raise SystemExit('program validation marker missing')
              text = text.replace(validation_marker, validation + validation_marker, 1)

          dispatch_marker = '    raise ValueError(f"unsupported node kind: {kind}")\n'
          dispatch = (
              '    if kind == "weighted_vote_veto":\n'
              '        if not isinstance(value, Mapping):\n'
              '            raise TypeError("weighted-vote input must be a mapping")\n'
              '        return _weighted_vote_veto(data, value, context)\n'
          )
          if 'raise TypeError("weighted-vote input must be a mapping")' not in text:
              if dispatch_marker not in text:
                  raise SystemExit('program dispatch marker missing')
              text = text.replace(dispatch_marker, dispatch + dispatch_marker, 1)
          program.write_text(text)

          grammar = root / 'grammar.py'
          text = grammar.read_text()
          grammar_marker = '\ndef _grid_data(instructions: str, inputs: Sequence[Any]) -> Mapping[str, Any] | None:\n'
          grammar_helper = dedent(r'''

          def _weighted_vote_veto_candidates(instructions: str, demos: Sequence[Any]) -> tuple[Mapping[str, Any], ...]:
              lowered = instructions.casefold()
              if "weighted vote" not in lowered or "veto" not in lowered:
                  return ()
              inputs = [_demo_parts(item)[0] for item in demos]
              if not inputs or not all(isinstance(item, Mapping) for item in inputs):
                  return ()

              threshold_match = re.search(r"minimum score\s+(-?\d+(?:\.\d+)?)", instructions, re.IGNORECASE)
              threshold = _number_data(Fraction(threshold_match.group(1))) if threshold_match else 0
              default_match = re.search(r"otherwise return\s+([a-z0-9_-]+)", instructions, re.IGNORECASE)
              if default_match is None:
                  return ()
              default = default_match.group(1)
              if "lexicograph" in lowered:
                  tie_policy = "lexicographic"
              elif "tie" in lowered and "first" in lowered:
                  tie_policy = "first"
              elif "tie" in lowered and "error" in lowered:
                  tie_policy = "error"
              else:
                  tie_policy = "lexicographic"

              def named(fields: tuple[str, ...], names: tuple[str, ...]) -> str | None:
                  exact = next((field for field in fields if field.casefold() in names), None)
                  if exact is not None:
                      return exact
                  return next((field for field in fields if any(name in field.casefold() for name in names)), None)

              candidates: list[Mapping[str, Any]] = []
              sequence_fields = [
                  field
                  for field in _common_fields(inputs)
                  if all(
                      isinstance(item[field], Sequence)
                      and not isinstance(item[field], (str, bytes, bytearray))
                      for item in inputs
                  )
              ]
              for ballots_field in sequence_fields:
                  rows = [row for item in inputs for row in item[ballots_field]]
                  fields = _common_fields(rows)
                  if not fields:
                      continue
                  choice_field = named(fields, ("option", "choice", "candidate", "proposal"))
                  weight_field = named(fields, ("weight", "power", "points", "strength"))
                  support_field = named(fields, ("support", "approve", "approval", "vote", "position"))
                  veto_field = named(fields, ("veto", "block", "blocked"))
                  if None in {choice_field, weight_field, support_field, veto_field}:
                      continue
                  data = {
                      "kind": "weighted_vote_veto",
                      "ballots_field": ballots_field,
                      "choice_field": choice_field,
                      "weight_field": weight_field,
                      "support_field": support_field,
                      "veto_field": veto_field,
                      "threshold": threshold,
                      "tie_policy": tie_policy,
                      "default": default,
                  }
                  try:
                      program = Program.parse(data)
                  except (TypeError, ValueError):
                      continue
                  if _fits(program, demos):
                      candidates.append(data)
              return tuple(candidates)
          ''')
          if '_weighted_vote_veto_candidates' not in text:
              if grammar_marker not in text:
                  raise SystemExit('grammar helper marker missing')
              text = text.replace(grammar_marker, grammar_helper + grammar_marker, 1)

          candidate_marker = '    priority = _priority_data(instructions, demos)\n'
          candidate = (
              '    for weighted_vote in _weighted_vote_veto_candidates(instructions, demos):\n'
              '        _add_if_fits(candidates, weighted_vote, demos)\n'
              '\n'
          )
          if 'for weighted_vote in _weighted_vote_veto_candidates' not in text:
              if candidate_marker not in text:
                  raise SystemExit('grammar candidate marker missing')
              text = text.replace(candidate_marker, candidate + candidate_marker, 1)
          grammar.write_text(text)

          loops = root / 'loops.py'
          text = loops.read_text()
          enum_marker = '    REWRITE_NORMAL_FORM = "REWRITE_NORMAL_FORM"\n'
          enum_addition = enum_marker + '    VOTE_PERMUTATION = "VOTE_PERMUTATION"\n'
          if 'VOTE_PERMUTATION' not in text:
              if enum_marker not in text:
                  raise SystemExit('loop enum marker missing')
              text = text.replace(enum_marker, enum_addition, 1)

          loop_marker = '    if data.get("kind") == "compose":\n'
          loop_block = dedent('''
              if data.get("kind") == "weighted_vote_veto" and data.get("tie_policy") == "lexicographic":
                  for index, demo in enumerate(demos[:3]):
                      inp, expected = _demo_parts(demo)
                      if not isinstance(inp, Mapping):
                          continue
                      ballots = inp.get(data["ballots_field"])
                      if not isinstance(ballots, Sequence) or isinstance(ballots, (str, bytes, bytearray)):
                          continue
                      permuted_input = deepcopy(dict(inp))
                      permuted_input[data["ballots_field"]] = list(reversed(deepcopy(ballots)))
                      mandatory.append(ClosedPath(
                          LoopKind.VOTE_PERMUTATION,
                          True,
                          permuted_input,
                          deepcopy(expected),
                          data,
                          f"vote-permutation-{index}",
                      ))

          ''')
          if 'LoopKind.VOTE_PERMUTATION' not in text:
              if loop_marker not in text:
                  raise SystemExit('loop insertion marker missing')
              text = text.replace(loop_marker, loop_block + loop_marker, 1)
          loops.write_text(text)

          proposer = root / 'proposer.py'
          text = proposer.read_text()
          fields_marker = '    "stack_rewrite": frozenset({"kind", "sequence_field", "token_mode", "rules"}),\n'
          fields_addition = fields_marker + '    "weighted_vote_veto": frozenset({"kind", "ballots_field", "choice_field", "weight_field", "support_field", "veto_field", "threshold", "tie_policy", "default"}),\n'
          if '"weighted_vote_veto": frozenset' not in text:
              if fields_marker not in text:
                  raise SystemExit('proposer field marker missing')
              text = text.replace(fields_marker, fields_addition, 1)

          constants_marker = '        for key, item in data.items():\n'
          constants = (
              '        elif kind == "weighted_vote_veto":\n'
              '            values.append(data.get("threshold"))\n'
              '            values.append(data.get("default"))\n'
          )
          if 'elif kind == "weighted_vote_veto":' not in text:
              if constants_marker not in text:
                  raise SystemExit('proposer constants marker missing')
              text = text.replace(constants_marker, constants + constants_marker, 1)
          proposer.write_text(text)
          PY

      - name: Verify focused behavior
        run: |
          PYTHONPATH=research python -m pytest research/universal_core/holonomy_v2/tests/test_weighted_vote_veto.py -q
          python -m py_compile research/universal_core/holonomy_v2/types.py research/universal_core/holonomy_v2/program.py research/universal_core/holonomy_v2/grammar.py research/universal_core/holonomy_v2/loops.py research/universal_core/holonomy_v2/proposer.py

      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2/types.py research/universal_core/holonomy_v2/program.py research/universal_core/holonomy_v2/grammar.py research/universal_core/holonomy_v2/loops.py research/universal_core/holonomy_v2/proposer.py
          git diff --cached --check
          git commit -m 'feat: add bounded weighted vote veto'
          git push origin HEAD:universal-core-holonomy-v2-1
