name: ARC Quadrant Role Boundary RED

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-quadrant-role-red.yml'

permissions:
  contents: write

jobs:
  verify-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Require missing role boundary
        run: |
          set +e
          python -m pytest -q \
            research/universal_core/holonomy_v2_2/tests/test_quadrant_mosaic.py::test_program_derivation_defers_uniform_quadrant_roles_to_tile \
            > /tmp/role-red.log 2>&1
          status=$?
          set -e
          cat /tmp/role-red.log
          test "$status" -ne 0
          grep -F 'NO_DISTINCT_QUADRANT_ROLES' /tmp/role-red.log
      - name: Commit RED evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'schema_version': 1,
              'source_commit': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'failure_confirmed': True,
              'root_cause': 'a transform supported in all four quadrant roles overlaps whole-grid tiling and can create hidden ambiguity on shape changes',
              'required_boundary': 'NO_DISTINCT_QUADRANT_ROLES',
              'test_command': 'python -m pytest -q research/universal_core/holonomy_v2_2/tests/test_quadrant_mosaic.py::test_program_derivation_defers_uniform_quadrant_roles_to_tile',
              'captured_log': Path('/tmp/role-red.log').read_text(encoding='utf-8'),
              'public_arc_evaluation_rerun': False,
          }
          path = Path('research/universal_core/holonomy_v2_2/evidence/QUADRANT_ROLE_BOUNDARY_RED.json')
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2_2/evidence/QUADRANT_ROLE_BOUNDARY_RED.json
          git commit -m 'arc: record quadrant role boundary RED'
          git push origin HEAD:universal-core-arc-training-v2-2
