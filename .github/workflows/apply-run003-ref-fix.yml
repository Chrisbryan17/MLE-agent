name: Apply Run003 Ref Fix

on:
  push:
    branches: [holonomy-v2-run-003-public]
    paths:
      - '.github/workflows/apply-run003-ref-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: holonomy-v2-run-003-public
          fetch-depth: 0
      - name: Assert untouched protocol state
        run: |
          set -euo pipefail
          test ! -e runs/run-003/COMMITMENT.json
          test ! -e runs/run-003/SUBMISSION_DIGEST.json
          test ! -e runs/run-003/SCORE_REPORT.json
      - name: Apply exact ref fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/holonomy-v2-run-003.yml')
          text = path.read_text()
          old_one = '          test "$(git rev-parse "$FROZEN_REF")" = "$FROZEN_SHA"\n'
          new_one = (
              '          git fetch --no-tags origin "$FROZEN_REF:refs/remotes/origin/$FROZEN_REF"\n'
              '          test "$(git rev-parse "refs/remotes/origin/$FROZEN_REF")" = "$FROZEN_SHA"\n'
          )
          old_two = '          test "$(git -C records rev-parse "$FROZEN_REF")" = "$FROZEN_SHA"\n'
          new_two = (
              '          git -C records fetch --no-tags origin "$FROZEN_REF:refs/remotes/origin/$FROZEN_REF"\n'
              '          test "$(git -C records rev-parse "refs/remotes/origin/$FROZEN_REF")" = "$FROZEN_SHA"\n'
          )
          if text.count(old_one) != 1 or text.count(old_two) != 1:
              raise SystemExit('expected ref checks not found exactly once')
          text = text.replace(old_one, new_one, 1).replace(old_two, new_two, 1)
          path.write_text(text)
          PY
          grep -q 'git fetch --no-tags origin' .github/workflows/holonomy-v2-run-003.yml
          grep -q 'git -C records fetch --no-tags origin' .github/workflows/holonomy-v2-run-003.yml
      - name: Commit workflow fix only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/holonomy-v2-run-003.yml
          git diff --cached --check
          git commit -m 'run003: fix archive ref verification before commitment'
          git push origin HEAD:holonomy-v2-run-003-public
