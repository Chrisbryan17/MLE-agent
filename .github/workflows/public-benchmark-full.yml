name: Full Public Benchmark Attempt 0001

on:
  push:
    branches:
      - universal-core-public-benchmark-adapters-v1
    paths:
      - '.github/workflows/public-benchmark-full.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: full-public-benchmark-attempt-0001
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1c6203ea2676e224bc49eaf130fa6e79e4a4e6a
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable benchmark corpus
        uses: actions/download-artifact@v4
        with:
          name: public-benchmarks-pinned-2026-08-04
          path: /tmp/pinned-public-benchmarks
          github-token: ${{ github.token }}
          repository: Chrisbryan17/MLE-agent
          run-id: '30929169392'
      - name: Verify pinned adapter and frozen core
        env:
          PYTHONPATH: research
        run: |
          test "$(git rev-parse HEAD)" = "c1c6203ea2676e224bc49eaf130fa6e79e4a4e6a"
          git diff --quiet 1d7c489bcdbff755d638b35ad47ce62bd4fe829d -- research/universal_core/holonomy_v2
          python -m pip install --disable-pip-version-check --quiet pytest
          python -m pytest -q research/universal_core/public_benchmarks/tests
          python -m pytest -q \
            research/universal_core/holonomy_v2/tests/test_blind_adapter.py \
            research/universal_core/holonomy_v2/tests/test_engine.py
      - name: Run full public attempt
        run: |
          set -o pipefail
          mkdir -p /tmp/public-benchmark-full-0001
          python -m research.universal_core.public_benchmarks.runner \
            --vendor-root /tmp/pinned-public-benchmarks \
            --output /tmp/public-benchmark-full-0001 \
            --mode full \
            --run-label public-benchmark-full-0001 \
            --adapter-commit c1c6203ea2676e224bc49eaf130fa6e79e4a4e6a \
            | tee /tmp/public-benchmark-full-0001/console-summary.json
      - name: Publish full attempt artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-benchmark-full-0001
          path: /tmp/public-benchmark-full-0001
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Write full run summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/public-benchmark-full-0001/report.json').read_text())
          lines = [
              '# Full public benchmark attempt 0001',
              '',
              f"- Report digest: `{report['report_digest']}`",
              f"- Adapter commit: `{report['identity']['adapter_commit']}`",
              f"- Frozen core: `{report['identity']['frozen_core_commit']}`",
              f"- Snapshot inventory: `{report['identity']['snapshot_inventory_digest']}`",
              f"- ARC: `{report['arc_agi_2']['metrics']}`",
              f"- BBEH transfer: `{report['bbeh_transfer']['metrics']}`",
              f"- LiveBench scalar transfer: `{report['livebench_scalar_transfer']['metrics']}`",
              f"- LiveBench unsupported rows: `{report['livebench_scalar_transfer']['unsupported_rows']}`",
          ]
          Path('/tmp/public-benchmark-full-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat /tmp/public-benchmark-full-summary.md >> "$GITHUB_STEP_SUMMARY"
