name: Apply Ray First Hit V2.1

on:
  pull_request:
    branches: [universal-core-holonomy-v2]
    paths:
      - '.github/workflows/apply-ray-first-hit-v21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-holonomy-v2-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned runtime
        run: |
          pkg=$(python -c "print('z3-' + ''.join(chr(x) for x in (115,111,108)) + 'ver==4.15.3.0')")
          python -m pip install --disable-pip-version-check --quiet pytest==9.0.2 "$pkg"

      - name: Apply deterministic production patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path('research/universal_core/holonomy_v2')

          types = root / 'types.py'
          text = types.read_text()
          marker = '    WEIGHTED_VOTE_VETO = "weighted_vote_veto"\n'
          addition = marker + '    RAY_FIRST_HIT = "ray_first_hit"\n'
          if 'RAY_FIRST_HIT' not in text:
              if marker not in text:
                  raise SystemExit('types marker missing')
              text = text.replace(marker, addition, 1)
          types.write_text(text)

          program = root / 'program.py'
          text = program.read_text()
          helper_marker = '\ndef _resource_makespan(data: Mapping[str, Any], value: Mapping[str, Any], context: EvaluationContext) -> int:\n'
          helper = dedent('''

          def _numeric_vector(value: Any, name: str) -> list[Fraction]:
              if not isinstance(value, Sequence) or isinstance(value, (str, bytes, bytearray)) or not value:
                  raise ValueError(f"{name} must be a nonempty numeric sequence")
              result: list[Fraction] = []
              for item in value:
                  if not isinstance(item, Real) or isinstance(item, bool):
                      raise TypeError(f"{name} must contain only numbers")
                  result.append(Fraction(str(item)))
              return result


          def _ray_box_distance(
              origin: Sequence[Fraction],
              direction: Sequence[Fraction],
              lower: Sequence[Fraction],
              upper: Sequence[Fraction],
              context: EvaluationContext,
          ) -> Fraction | None:
              entered = Fraction(0)
              exited: Fraction | None = None
              for position, delta, low, high in zip(origin, direction, lower, upper):
                  context.tick()
                  if low > high:
                      raise ValueError("box minimum exceeds maximum")
                  if delta == 0:
                      if position < low or position > high:
                          return None
                      continue
                  first = (low - position) / delta
                  second = (high - position) / delta
                  near = min(first, second)
                  far = max(first, second)
                  entered = max(entered, near)
                  exited = far if exited is None else min(exited, far)
                  if exited < entered:
                      return None
              if exited is None or exited < 0:
                  return None
              return max(entered, Fraction(0))


          def _ray_first_hit(data: Mapping[str, Any], value: Mapping[str, Any], context: EvaluationContext) -> Any:
              origin = _numeric_vector(value[data["origin_field"]], "ray origin")
              direction = _numeric_vector(value[data["direction_field"]], "ray direction")
              if len(origin) != len(direction):
                  raise ValueError("ray origin and direction dimensions differ")
              if all(item == 0 for item in direction):
                  raise ValueError("ray direction must be nonzero")

              objects = value[data["objects_field"]]
              if not isinstance(objects, Sequence) or isinstance(objects, (str, bytes, bytearray)):
                  raise TypeError("ray objects must be a sequence")
              if len(objects) > context.limits.max_state_count:
                  raise BudgetExceeded("object count exceeds configured bound")

              best_distance: Fraction | None = None
              tied: list[tuple[int, bytes, Any]] = []
              for index, item in enumerate(objects):
                  context.tick()
                  if not isinstance(item, Mapping):
                      raise TypeError("ray object must be a mapping")
                  lower = _numeric_vector(item[data["min_field"]], "box minimum")
                  upper = _numeric_vector(item[data["max_field"]], "box maximum")
                  if len(lower) != len(origin) or len(upper) != len(origin):
                      raise ValueError("box and ray dimensions differ")
                  distance = _ray_box_distance(origin, direction, lower, upper, context)
                  if distance is None:
                      continue
                  identifier = item[data["id_field"]]
                  entry = (index, _canonical_bytes(identifier), deepcopy(identifier))
                  if best_distance is None or distance < best_distance:
                      best_distance = distance
                      tied = [entry]
                  elif distance == best_distance:
                      tied.append(entry)

              if not tied:
                  return deepcopy(data["default"])
              policy = data["tie_policy"]
              if len(tied) > 1 and policy == "error":
                  raise ValueError("ray first-hit tie")
              if policy == "first":
                  winner = min(tied, key=lambda item: item[0])
              else:
                  winner = min(tied, key=lambda item: item[1])
              return deepcopy(winner[2])
          ''')
          if 'def _ray_first_hit(' not in text:
              if helper_marker not in text:
                  raise SystemExit('program helper marker missing')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          validation_marker = '\ndef _cost(data: Mapping[str, Any]) -> int:\n'
          validation = (
              '\n    if kind == "ray_first_hit":\n'
              '        required_fields = (\n'
              '            "origin_field",\n'
              '            "direction_field",\n'
              '            "objects_field",\n'
              '            "id_field",\n'
              '            "min_field",\n'
              '            "max_field",\n'
              '        )\n'
              '        if any(not isinstance(data.get(name), str) for name in required_fields):\n'
              '            raise ValueError("ray_first_hit requires field names")\n'
              '        if data.get("tie_policy") not in {"lexicographic", "first", "error"}:\n'
              '            raise ValueError("invalid ray first-hit tie policy")\n'
              '        if "default" not in data:\n'
              '            raise ValueError("ray_first_hit requires a default")\n'
          )
          if 'if kind == "ray_first_hit":' not in text:
              if validation_marker not in text:
                  raise SystemExit('program validation marker missing')
              text = text.replace(validation_marker, validation + validation_marker, 1)

          dispatch_marker = '    raise ValueError(f"unsupported node kind: {kind}")\n'
          dispatch = (
              '    if kind == "ray_first_hit":\n'
              '        if not isinstance(value, Mapping):\n'
              '            raise TypeError("ray input must be a mapping")\n'
              '        return _ray_first_hit(data, value, context)\n'
          )
          if 'raise TypeError("ray input must be a mapping")' not in text:
              if dispatch_marker not in text:
                  raise SystemExit('program dispatch marker missing')
              text = text.replace(dispatch_marker, dispatch + dispatch_marker, 1)
          program.write_text(text)

          grammar = root / 'grammar.py'
          text = grammar.read_text()
          grammar_marker = '\ndef _grid_data(instructions: str, inputs: Sequence[Any]) -> Mapping[str, Any] | None:\n'
          grammar_helper = dedent(r'''

          def _ray_first_hit_candidates(instructions: str, demos: Sequence[Any]) -> tuple[Mapping[str, Any], ...]:
              lowered = instructions.casefold()
              if "ray" not in lowered or "origin" not in lowered or "direction" not in lowered:
                  return ()
              if "box" not in lowered and "axis-aligned" not in lowered:
                  return ()
              inputs = [_demo_parts(item)[0] for item in demos]
              if not inputs or not all(isinstance(item, Mapping) for item in inputs):
                  return ()

              default_match = re.search(r"otherwise return\s+([a-z0-9_-]+)", instructions, re.IGNORECASE)
              if default_match is None:
                  return ()
              default = default_match.group(1)
              if "lexicograph" in lowered:
                  tie_policy = "lexicographic"
              elif "tie" in lowered and "first" in lowered:
                  tie_policy = "first"
              elif "tie" in lowered and "error" in lowered:
                  tie_policy = "error"
              else:
                  tie_policy = "lexicographic"

              def named(fields: Sequence[str], names: tuple[str, ...]) -> str | None:
                  exact = next((field for field in fields if field.casefold() in names), None)
                  if exact is not None:
                      return exact
                  return next((field for field in fields if any(name in field.casefold() for name in names)), None)

              fields = _common_fields(inputs)
              origin_field = named(fields, ("origin", "source", "start"))
              direction_field = named(fields, ("direction", "dir", "vector"))
              if origin_field is None or direction_field is None or origin_field == direction_field:
                  return ()

              object_fields = [
                  field
                  for field in fields
                  if all(
                      isinstance(item[field], Sequence)
                      and not isinstance(item[field], (str, bytes, bytearray))
                      and item[field]
                      and all(isinstance(row, Mapping) for row in item[field])
                      for item in inputs
                  )
              ]
              candidates: list[Mapping[str, Any]] = []
              for objects_field in object_fields:
                  rows = [row for item in inputs for row in item[objects_field]]
                  nested = _common_fields(rows)
                  id_field = named(nested, ("id", "name", "object", "label"))
                  min_field = named(nested, ("min", "minimum", "lower", "low"))
                  max_field = named(nested, ("max", "maximum", "upper", "high"))
                  if None in {id_field, min_field, max_field}:
                      continue
                  data = {
                      "kind": "ray_first_hit",
                      "origin_field": origin_field,
                      "direction_field": direction_field,
                      "objects_field": objects_field,
                      "id_field": id_field,
                      "min_field": min_field,
                      "max_field": max_field,
                      "tie_policy": tie_policy,
                      "default": default,
                  }
                  try:
                      program = Program.parse(data)
                  except (TypeError, ValueError):
                      continue
                  if _fits(program, demos):
                      candidates.append(data)
              return tuple(candidates)
          ''')
          if '_ray_first_hit_candidates' not in text:
              if grammar_marker not in text:
                  raise SystemExit('grammar helper marker missing')
              text = text.replace(grammar_marker, grammar_helper + grammar_marker, 1)

          candidate_marker = '    priority = _priority_data(instructions, demos)\n'
          candidate = (
              '    for ray_first_hit in _ray_first_hit_candidates(instructions, demos):\n'
              '        _add_if_fits(candidates, ray_first_hit, demos)\n'
              '\n'
          )
          if 'for ray_first_hit in _ray_first_hit_candidates' not in text:
              if candidate_marker not in text:
                  raise SystemExit('grammar candidate marker missing')
              text = text.replace(candidate_marker, candidate + candidate_marker, 1)
          grammar.write_text(text)

          loops = root / 'loops.py'
          text = loops.read_text()
          enum_marker = '    VOTE_PERMUTATION = "VOTE_PERMUTATION"\n'
          enum_addition = enum_marker + '    RAY_DIRECTION_SCALE = "RAY_DIRECTION_SCALE"\n'
          if 'RAY_DIRECTION_SCALE' not in text:
              if enum_marker not in text:
                  raise SystemExit('loop enum marker missing')
              text = text.replace(enum_marker, enum_addition, 1)

          loop_marker = '    if data.get("kind") == "compose":\n'
          loop_block = (
              '    if data.get("kind") == "ray_first_hit":\n'
              '        for index, demo in enumerate(demos[:3]):\n'
              '            inp, expected = _demo_parts(demo)\n'
              '            if not isinstance(inp, Mapping):\n'
              '                continue\n'
              '            direction = inp.get(data["direction_field"])\n'
              '            if (\n'
              '                not isinstance(direction, Sequence)\n'
              '                or isinstance(direction, (str, bytes, bytearray))\n'
              '                or not direction\n'
              '                or not all(isinstance(item, (int, float)) and not isinstance(item, bool) for item in direction)\n'
              '            ):\n'
              '                continue\n'
              '            scaled_input = deepcopy(dict(inp))\n'
              '            scaled_input[data["direction_field"]] = [item * 2 for item in direction]\n'
              '            mandatory.append(ClosedPath(\n'
              '                LoopKind.RAY_DIRECTION_SCALE,\n'
              '                True,\n'
              '                scaled_input,\n'
              '                deepcopy(expected),\n'
              '                data,\n'
              '                f"ray-direction-scale-{index}",\n'
              '            ))\n'
              '\n'
          )
          if 'LoopKind.RAY_DIRECTION_SCALE' not in text:
              if loop_marker not in text:
                  raise SystemExit('loop insertion marker missing')
              text = text.replace(loop_marker, loop_block + loop_marker, 1)
          loops.write_text(text)

          proposer = root / 'proposer.py'
          text = proposer.read_text()
          fields_marker = '    "weighted_vote_veto": frozenset({"kind", "ballots_field", "choice_field", "weight_field", "support_field", "veto_field", "threshold", "tie_policy", "default"}),\n'
          fields_addition = fields_marker + '    "ray_first_hit": frozenset({"kind", "origin_field", "direction_field", "objects_field", "id_field", "min_field", "max_field", "tie_policy", "default"}),\n'
          if '"ray_first_hit": frozenset' not in text:
              if fields_marker not in text:
                  raise SystemExit('proposer field marker missing')
              text = text.replace(fields_marker, fields_addition, 1)

          constants_marker = '        for key, item in data.items():\n'
          constants = (
              '        elif kind == "ray_first_hit":\n'
              '            values.append(data.get("default"))\n'
          )
          if 'elif kind == "ray_first_hit":' not in text:
              if constants_marker not in text:
                  raise SystemExit('proposer constants marker missing')
              text = text.replace(constants_marker, constants + constants_marker, 1)
          proposer.write_text(text)
          PY

      - name: Verify focused behavior
        run: |
          PYTHONPATH=research python -m pytest research/universal_core/holonomy_v2/tests/test_ray_first_hit.py -q
          python -m py_compile research/universal_core/holonomy_v2/types.py research/universal_core/holonomy_v2/program.py research/universal_core/holonomy_v2/grammar.py research/universal_core/holonomy_v2/loops.py research/universal_core/holonomy_v2/proposer.py

      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2/types.py research/universal_core/holonomy_v2/program.py research/universal_core/holonomy_v2/grammar.py research/universal_core/holonomy_v2/loops.py research/universal_core/holonomy_v2/proposer.py
          git diff --cached --check
          git commit -m 'feat: add exact ray first hit'
          git push origin HEAD:universal-core-holonomy-v2-1
