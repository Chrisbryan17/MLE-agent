name: Universal Shuffled Exact V3

on:
  pull_request:
    branches:
      - universal-adaptive-exact-v2
    paths:
      - 'research/universal_validation/bbeh_shuffled_exact_v3.py'
      - '.github/workflows/universal-shuffled-exact-v3.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-shuffled-exact-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned BBEH
        run: |
          mkdir -p research/universal_validation/.external
          git clone https://github.com/google-deepmind/bbeh.git research/universal_validation/.external/bbeh
          git -C research/universal_validation/.external/bbeh checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
      - name: Evaluate exact shuffled-object cell
        working-directory: research/universal_validation
        env:
          BBEH_TASK_ROOT: .external/bbeh/bbeh/benchmark_tasks
        run: |
          mkdir -p artifacts/shuffled_exact_v3
          python -m py_compile bbeh_shuffled_exact_v3.py
          python bbeh_shuffled_exact_v3.py 2>&1 | tee artifacts/shuffled_exact_v3/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: universal-shuffled-exact-v3
          path: |
            research/universal_validation/artifacts/shuffled_exact_v3/**
            research/universal_validation/bbeh_shuffled_exact_v3.py
          if-no-files-found: error
