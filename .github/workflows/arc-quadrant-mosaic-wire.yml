name: Wire ARC Quadrant Mosaic

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-quadrant-mosaic-wire.yml'

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Apply guarded quadrant integration
        run: |
          python - <<'PY'
          from pathlib import Path

          grid_path = Path('research/universal_core/holonomy_v2_2/grid_induction.py')
          text = grid_path.read_text(encoding='utf-8')
          import_anchor = 'from .mirror_concat import apply_mirror_concat\n'
          import_value = import_anchor + 'from .quadrant_mosaic import apply_quadrant_mosaic\n'
          if text.count(import_anchor) != 1 or 'from .quadrant_mosaic import' in text:
              raise SystemExit('quadrant import anchor mismatch')
          text = text.replace(import_anchor, import_value, 1)

          version_anchor = '_VERSION = "grid-v2.2-9"'
          if text.count(version_anchor) != 1:
              raise SystemExit('quadrant version anchor mismatch')
          text = text.replace(version_anchor, '_VERSION = "grid-v2.2-10"', 1)

          apply_anchor = '    if kind == "mirror_concatenate":\n'
          apply_value = (
              '    if kind == "dihedral_quadrant_mosaic":\n'
              '        return apply_quadrant_mosaic(program, grid)\n'
          )
          if text.count(apply_anchor) != 1:
              raise SystemExit('quadrant apply anchor mismatch')
          text = text.replace(apply_anchor, apply_value + apply_anchor, 1)
          grid_path.write_text(text, encoding='utf-8')

          runtime_path = Path('research/universal_core/holonomy_v2_2/grid_mechanistic_runtime.py')
          text = runtime_path.read_text(encoding='utf-8')
          runtime_import = 'from .mirror_concat import mirror_concat_programs\n'
          runtime_import_value = runtime_import + 'from .quadrant_mosaic import quadrant_mosaic_programs\n'
          if text.count(runtime_import) != 1 or 'quadrant_mosaic_programs' in text:
              raise SystemExit('quadrant runtime import anchor mismatch')
          text = text.replace(runtime_import, runtime_import_value, 1)

          derived_anchor = '    mirror_concat, mirror_reason = mirror_concat_programs(demos)\n'
          derived_value = derived_anchor + '    quadrant_mosaic, quadrant_reason = quadrant_mosaic_programs(demos)\n'
          if text.count(derived_anchor) != 1:
              raise SystemExit('quadrant derivation anchor mismatch')
          text = text.replace(derived_anchor, derived_value, 1)

          batch_anchor = '        ("mirror_concat", mirror_concat, mirror_reason),\n'
          batch_value = batch_anchor + '        ("quadrant_mosaic", quadrant_mosaic, quadrant_reason),\n'
          if text.count(batch_anchor) != 1:
              raise SystemExit('quadrant batch anchor mismatch')
          text = text.replace(batch_anchor, batch_value, 1)
          runtime_path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile \
            research/universal_core/holonomy_v2_2/quadrant_mosaic.py \
            research/universal_core/holonomy_v2_2/grid_induction.py \
            research/universal_core/holonomy_v2_2/grid_mechanistic_runtime.py
          git diff --check
      - name: Run focused quadrant tests
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            research/universal_core/holonomy_v2_2/tests/test_quadrant_mosaic_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_quadrant_mosaic.py \
            research/universal_core/holonomy_v2_2/tests/test_mirror_concat.py \
            research/universal_core/holonomy_v2_2/tests/test_bbox_complete.py \
            research/universal_core/holonomy_v2_2/tests/test_component_outlier.py \
            research/universal_core/holonomy_v2_2/tests/test_marker_recolor.py \
            research/universal_core/holonomy_v2_2/tests/test_grid_mechanistic.py \
            | tee /tmp/focused.log
      - name: Run all V2.2 tests
        id: cluster
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q research/universal_core/holonomy_v2_2/tests | tee /tmp/v2-2.log
      - name: Run frozen V2 integration tests
        id: frozen
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: research
        run: |
          set -o pipefail
          python -m pytest -q \
            research/universal_core/holonomy_v2/tests/test_blind_adapter.py \
            research/universal_core/holonomy_v2/tests/test_engine.py | tee /tmp/frozen.log
      - name: Confirm frozen V2 bytes are unchanged
        id: byte_gate
        if: always()
        continue-on-error: true
        run: git diff --quiet 1d7c489bcdbff755d638b35ad47ce62bd4fe829d -- research/universal_core/holonomy_v2
      - name: Record result and commit only valid state
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          CLUSTER_OUTCOME: ${{ steps.cluster.outcome }}
          FROZEN_OUTCOME: ${{ steps.frozen.outcome }}
          BYTE_OUTCOME: ${{ steps.byte_gate.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          outcomes = {
              'focused': os.environ['FOCUSED_OUTCOME'],
              'v2_2_cluster': os.environ['CLUSTER_OUTCOME'],
              'frozen_tests': os.environ['FROZEN_OUTCOME'],
              'frozen_byte_gate': os.environ['BYTE_OUTCOME'],
          }
          passed = all(value == 'success' for value in outcomes.values())
          evidence = {
              'schema_version': 1,
              'workflow_source_commit': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'passed': passed,
              'outcomes': outcomes,
              'focused_output': Path('/tmp/focused.log').read_text(encoding='utf-8') if Path('/tmp/focused.log').exists() else '',
              'v2_2_output': Path('/tmp/v2-2.log').read_text(encoding='utf-8') if Path('/tmp/v2-2.log').exists() else '',
              'frozen_output': Path('/tmp/frozen.log').read_text(encoding='utf-8') if Path('/tmp/frozen.log').exists() else '',
              'expected_new_exact_tasks': [
                  '0c786b71', '3af2c5a8', '46442a0e', '62c24649', '67e8384a',
                  '7953d61e', '7fe24cdd', '833dafe3', 'ed98d772',
              ],
              'expected_training_delta': {
                  'correct_rows': 9,
                  'accepted_rows': 9,
                  'grammar_exhausted_rows': -9,
              },
              'frozen_core_commit': '1d7c489bcdbff755d638b35ad47ce62bd4fe829d',
              'public_arc_evaluation_rerun': False,
          }
          name = 'QUADRANT_MOSAIC_GREEN.json' if passed else 'QUADRANT_MOSAIC_DIAGNOSTIC.json'
          path = Path('research/universal_core/holonomy_v2_2/evidence') / name
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          Path('/tmp/passed').write_text('1' if passed else '0', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$(cat /tmp/passed)" = "1" ]; then
            git add \
              research/universal_core/holonomy_v2_2/grid_induction.py \
              research/universal_core/holonomy_v2_2/grid_mechanistic_runtime.py \
              research/universal_core/holonomy_v2_2/evidence/QUADRANT_MOSAIC_GREEN.json
            git commit -m 'arc: wire dihedral quadrant mosaic'
          else
            git restore \
              research/universal_core/holonomy_v2_2/grid_induction.py \
              research/universal_core/holonomy_v2_2/grid_mechanistic_runtime.py
            git add research/universal_core/holonomy_v2_2/evidence/QUADRANT_MOSAIC_DIAGNOSTIC.json
            git commit -m 'arc: record quadrant mosaic diagnostic failure'
          fi
          git push origin HEAD:universal-core-arc-training-v2-2
          test "$(cat /tmp/passed)" = "1"
