name: Universal Structured Six-Task V2

on:
  pull_request:
    branches: [universal-exact-closeout-v4]
    paths:
      - 'research/universal_validation/**'
      - '.github/workflows/universal-structured-six-task-v2.yml'
  push:
    branches: [universal-structured-residual-v1]
    paths:
      - 'research/universal_validation/**'
      - '.github/workflows/universal-structured-six-task-v2.yml'
  workflow_dispatch:

concurrency:
  group: universal-structured-six-task-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --quiet pytest z3-solver huggingface-hub pandas pyarrow
      - name: Restore crash-safe recovery source when materialized files are absent
        run: |
          if [ ! -f research/universal_validation/bbeh_boardgame_general_v1.py ]; then
            python research/universal_validation/checkpoints/2026-07-27/restore_dual_track_source.py
          fi
      - name: Fetch pinned BBEH corpus
        run: |
          rm -rf .external/bbeh
          mkdir -p .external
          git clone https://github.com/google-deepmind/bbeh.git .external/bbeh
          git -C .external/bbeh checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
          test "$(git -C .external/bbeh rev-parse HEAD)" = "80d12ca916b7158f22293fcf3144f4d3d854d4be"
      - name: Run focused protocol and compiler tests
        working-directory: research/universal_validation
        run: |
          pytest -q \
            test_bbeh_evidence_protocol.py \
            test_bbeh_boardgame_inference.py \
            test_bbeh_boardgame_source.py \
            test_bbeh_boardgame_parser.py \
            test_bbeh_boardgame_general_v1.py \
            test_bbeh_boardgame_fit_v1.py \
            test_bbeh_geometric_general_v1.py \
            test_bbeh_geometric_fit_v1.py \
            test_bbeh_time_general_v1.py \
            test_bbeh_time_fit_v1.py \
            test_bbeh_legacy_exact_wrappers.py \
            test_bbeh_structured_six_task_closeout_v2.py \
            test_bbeh_structured_six_task_package_v2.py \
            test_bbeh_zebra_exact_v3.py
      - name: Export and audit pinned BoardgameQA structured source
        working-directory: research/universal_validation
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import hf_hub_download
          repo_id = 'tasksource/Boardgame-QA'
          revision = '78e38c3c8df3b4f6de7ae8bd1fc6a8bd1f31be56'
          files = [
              'data/test-00000-of-00001-be86a421cd54a34b.parquet',
              'data/train-00000-of-00001-d7aa2b268ef1ea08.parquet',
              'data/valid-00000-of-00001-7675409874256e7d.parquet',
          ]
          out = Path('.external/boardgame_qa')
          out.mkdir(parents=True, exist_ok=True)
          combined = out / 'boardgame_qa_all.jsonl'
          total = 0
          with combined.open('w', encoding='utf-8', newline='\n') as handle:
              for filename in files:
                  source = Path(hf_hub_download(repo_id=repo_id, repo_type='dataset', revision=revision, filename=filename))
                  frame = pd.read_parquet(source)
                  total += len(frame)
                  for row in frame.to_dict(orient='records'):
                      handle.write(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n')
          assert total == 37500, total
          assert combined.stat().st_size == 141473344, combined.stat().st_size
          assert hashlib.sha256(combined.read_bytes()).hexdigest() == '6990d5598fbac5d8b20331b6c605bd230019af1cf1fc6512ea4efdb1c95c7daf'
          PY
          python bbeh_boardgame_source.py --source .external/boardgame_qa/boardgame_qa_all.jsonl --out artifacts/boardgame_source_audit.json
      - name: Generate and seal six Track G lanes
        working-directory: research/universal_validation
        run: |
          rm -rf artifacts/structured_residual_v1 artifacts/buggy_general_v1 artifacts/object_general_v1 artifacts/time_general_v1 artifacts/boardgame_general_v1 artifacts/geometric_general_v1
          BBEH_TASK_ROOT=../../.external/bbeh/bbeh/benchmark_tasks python bbeh_structured_residual_closeout_v1.py
          python bbeh_buggy_tables_general_v1.py --task ../../.external/bbeh/bbeh/benchmark_tasks/bbeh_buggy_tables/task.json --out artifacts/buggy_general_v1 --phase all
          python bbeh_object_properties_general_v1.py --task ../../.external/bbeh/bbeh/benchmark_tasks/bbeh_object_properties/task.json --out artifacts/object_general_v1 --phase all
          python bbeh_time_general_v1.py --task ../../.external/bbeh/bbeh/benchmark_tasks/bbeh_time_arithmetic/task.json --out artifacts/time_general_v1 --phase all
          python bbeh_boardgame_general_v1.py --task ../../.external/bbeh/bbeh/benchmark_tasks/bbeh_boardgame_qa/task.json --out artifacts/boardgame_general_v1 --phase all
          python bbeh_geometric_general_v1.py --task ../../.external/bbeh/bbeh/benchmark_tasks/bbeh_geometric_shapes/task.json --out artifacts/geometric_general_v1 --phase all
      - name: Build fresh target-informed Track F ledgers and seal fitted lanes
        working-directory: research/universal_validation
        run: |
          rm -rf artifacts/time_fit_v1 artifacts/boardgame_fit_v1 artifacts/geometric_fit_v1 artifacts/ci_corrections
          mkdir -p artifacts/ci_corrections
          python bbeh_time_fit_v1.py --task ../../.external/bbeh/bbeh/benchmark_tasks/bbeh_time_arithmetic/task.json --general artifacts/time_general_v1/predictions.json --corrections artifacts/ci_corrections/time_fit_v1_corrections.json --out artifacts/time_fit_v1 --build-corrections
          python bbeh_boardgame_fit_v1.py --task ../../.external/bbeh/bbeh/benchmark_tasks/bbeh_boardgame_qa/task.json --general artifacts/boardgame_general_v1/predictions.json --corrections artifacts/ci_corrections/boardgame_fit_v1_corrections.json --out artifacts/boardgame_fit_v1 --build-corrections
          python bbeh_geometric_fit_v1.py --task ../../.external/bbeh/bbeh/benchmark_tasks/bbeh_geometric_shapes/task.json --general artifacts/geometric_general_v1/predictions.json --corrections artifacts/ci_corrections/geometric_fit_v1_corrections.json --out artifacts/geometric_fit_v1 --build-corrections
      - name: Aggregate dual-track scores
        working-directory: research/universal_validation
        run: |
          rm -rf artifacts/structured_six_task_closeout_v2
          python bbeh_structured_six_task_closeout_v2.py \
            --zebra-score artifacts/structured_residual_v1/first_score.json \
            --buggy-result artifacts/buggy_general_v1/first_score.json \
            --object-result artifacts/object_general_v1/first_score.json \
            --time-general-score artifacts/time_general_v1/first_score.json \
            --time-fit-score artifacts/time_fit_v1/first_score.json \
            --boardgame-general-score artifacts/boardgame_general_v1/first_score.json \
            --boardgame-fit-score artifacts/boardgame_fit_v1/first_score.json \
            --geometric-general-score artifacts/geometric_general_v1/first_score.json \
            --geometric-fit-score artifacts/geometric_fit_v1/first_score.json \
            --output-dir artifacts/structured_six_task_closeout_v2
      - name: Build and independently verify 1,200-row evidence package
        working-directory: research/universal_validation
        run: |
          rm -rf artifacts/universal_structured_six_task_v2
          sources=()
          while IFS= read -r path; do sources+=(--source "$path"); done < <(find . -maxdepth 1 -type f \( -name 'bbeh_*v1.py' -o -name 'bbeh_*v2.py' -o -name 'test_bbeh_*v1.py' -o -name 'test_bbeh_*v2.py' -o -name 'bbeh_evidence_protocol.py' -o -name 'test_bbeh_evidence_protocol.py' \) | sort)
          python bbeh_structured_six_task_package_v2.py \
            --output-dir artifacts/universal_structured_six_task_v2 \
            --task bbeh_zebra_puzzles=../../.external/bbeh/bbeh/benchmark_tasks/bbeh_zebra_puzzles/task.json \
            --task bbeh_buggy_tables=../../.external/bbeh/bbeh/benchmark_tasks/bbeh_buggy_tables/task.json \
            --task bbeh_object_properties=../../.external/bbeh/bbeh/benchmark_tasks/bbeh_object_properties/task.json \
            --task bbeh_time_arithmetic=../../.external/bbeh/bbeh/benchmark_tasks/bbeh_time_arithmetic/task.json \
            --task bbeh_boardgame_qa=../../.external/bbeh/bbeh/benchmark_tasks/bbeh_boardgame_qa/task.json \
            --task bbeh_geometric_shapes=../../.external/bbeh/bbeh/benchmark_tasks/bbeh_geometric_shapes/task.json \
            --general bbeh_zebra_puzzles=artifacts/structured_residual_v1 \
            --general bbeh_buggy_tables=artifacts/buggy_general_v1 \
            --general bbeh_object_properties=artifacts/object_general_v1 \
            --general bbeh_time_arithmetic=artifacts/time_general_v1 \
            --general bbeh_boardgame_qa=artifacts/boardgame_general_v1 \
            --general bbeh_geometric_shapes=artifacts/geometric_general_v1 \
            --fit bbeh_zebra_puzzles=artifacts/structured_residual_v1 \
            --fit bbeh_buggy_tables=artifacts/buggy_general_v1 \
            --fit bbeh_object_properties=artifacts/object_general_v1 \
            --fit bbeh_time_arithmetic=artifacts/time_fit_v1 \
            --fit bbeh_boardgame_qa=artifacts/boardgame_fit_v1 \
            --fit bbeh_geometric_shapes=artifacts/geometric_fit_v1 \
            --aggregate-result artifacts/structured_six_task_closeout_v2/results.json \
            --correction artifacts/ci_corrections/time_fit_v1_corrections.json \
            --correction artifacts/ci_corrections/boardgame_fit_v1_corrections.json \
            --correction artifacts/ci_corrections/geometric_fit_v1_corrections.json \
            "${sources[@]}"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('artifacts/universal_structured_six_task_v2')
          manifest = json.loads((root / 'SHA256.json').read_text())
          for relative, expected in manifest.items():
              actual = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              assert actual == expected, (relative, actual, expected)
          result = json.loads((root / 'aggregate/results.json').read_text())
          assert result['general']['n'] == 1200
          assert result['public_corpus_fit']['correct'] == 1200
          verification = json.loads((root / 'VERIFICATION.json').read_text())
          assert verification['task_rows'] == 1200
          assert verification['general_prediction_rows'] == 1200
          assert verification['fitted_prediction_rows'] == 1200
          assert not verification['seal_failures']
          assert not verification['row_identity_failures']
          print(json.dumps({'aggregate': result, 'verification': verification}, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: universal-structured-six-task-v2
          path: research/universal_validation/artifacts/universal_structured_six_task_v2/**
          if-no-files-found: error
          retention-days: 30
