name: Recover Holonomy V2 Task 8

on:
  pull_request:
    branches: [universal-core-holonomy-v2]
    paths:
      - '.github/workflows/recover-holonomy-v2-task8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reconstruct historical payload
        shell: bash
        run: |
          set -u
          mkdir -p recovery/raw recovery/output recovery/extracted
          git show 78ff58687d1e2b4668b767eb9585223cfc74f0dd:.transport/holonomy-v2-task8/part-00 > recovery/raw/part-00
          git show 45989fca3e7d073c83123504fc6b0eb988db5fb0:.transport/holonomy-v2-task8/part-01 > recovery/raw/part-01
          wc -c recovery/raw/part-* > recovery/output/PART_SIZES.txt
          cat recovery/raw/part-* | base64 -d > recovery/output/task8.tar.gz
          sha256sum recovery/output/task8.tar.gz > recovery/output/ACTUAL_SHA256.txt
          printf '%s\n' 'd0a959d5a642b4588233dee104f3c26fbe35e463846c79c7c0c9fb2a3071dc24  task8.tar.gz' > recovery/output/DECLARED_SHA256.txt
          if gzip -t recovery/output/task8.tar.gz 2> recovery/output/GZIP_ERROR.txt; then
            echo valid > recovery/output/GZIP_STATUS.txt
            tar -tzf recovery/output/task8.tar.gz > recovery/output/TAR_CONTENTS.txt 2> recovery/output/TAR_ERROR.txt || true
            tar -xzf recovery/output/task8.tar.gz -C recovery/extracted 2>> recovery/output/TAR_ERROR.txt || true
          else
            echo invalid > recovery/output/GZIP_STATUS.txt
            python - <<'PY'
          import gzip
          from pathlib import Path

          source = Path('recovery/output/task8.tar.gz')
          target = Path('recovery/output/task8.partial.tar')
          recovered = bytearray()
          try:
              with gzip.open(source, 'rb') as handle:
                  while True:
                      block = handle.read(65536)
                      if not block:
                          break
                      recovered.extend(block)
          except Exception as exc:
              Path('recovery/output/PARTIAL_GZIP_ERROR.txt').write_text(f'{type(exc).__name__}: {exc}\n')
          target.write_bytes(recovered)
          Path('recovery/output/PARTIAL_TAR_SIZE.txt').write_text(f'{len(recovered)}\n')
          PY
            tar -tf recovery/output/task8.partial.tar > recovery/output/PARTIAL_TAR_CONTENTS.txt 2> recovery/output/PARTIAL_TAR_ERROR.txt || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: holonomy-v2-task8-recovery
          path: recovery
          retention-days: 7
          if-no-files-found: error
