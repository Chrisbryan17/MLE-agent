name: ARC Component Outlier Mechanistic Corpus

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-component-outlier-corpus.yml'

permissions:
  contents: read
  actions: read

jobs:
  training-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable benchmark corpus
        uses: actions/download-artifact@v4
        with:
          name: public-benchmarks-pinned-2026-08-04
          path: /tmp/pinned-public-benchmarks
          github-token: ${{ github.token }}
          repository: Chrisbryan17/MLE-agent
          run-id: '30929169392'
      - name: Download immutable V2.2 baseline report
        uses: actions/download-artifact@v4
        with:
          name: arc-v2-2-training-e50965009efb96457fd769d97b42027f8a4e98c0
          path: /tmp/arc-v2-2-baseline
          github-token: ${{ github.token }}
          repository: Chrisbryan17/MLE-agent
          run-id: '30941837872'
      - name: Verify V2.2 and frozen V2 gates
        env:
          PYTHONPATH: research
        run: |
          python -m pip install --disable-pip-version-check --quiet pytest
          python -m pytest -q research/universal_core/holonomy_v2_2/tests
          python -m pytest -q \
            research/universal_core/holonomy_v2/tests/test_blind_adapter.py \
            research/universal_core/holonomy_v2/tests/test_engine.py
          git diff --quiet 1d7c489bcdbff755d638b35ad47ce62bd4fe829d -- research/universal_core/holonomy_v2
      - name: Run all ARC training tasks with complete traces
        run: |
          mkdir -p /tmp/arc-v2-2-outlier/traces
          python - <<'PY' | tee /tmp/arc-v2-2-outlier/console-summary.json
          import json
          import os
          from pathlib import Path

          from research.universal_core.holonomy_v2.engine import HolonomyEngine
          from research.universal_core.holonomy_v2.types import SearchConfig
          from research.universal_core.holonomy_v2_2.mechanistic_trace import validate_trace
          from research.universal_core.holonomy_v2_2.training_eval import run_training_corpus, write_report
          from research.universal_core.public_benchmarks.suite import locate_vendor

          output = Path('/tmp/arc-v2-2-outlier')
          trace_dir = output / 'traces'
          vendor = locate_vendor(Path('/tmp/pinned-public-benchmarks'))
          report = run_training_corpus(
              vendor,
              HolonomyEngine(SearchConfig()),
              run_label='arc-v2-2-outlier-' + os.environ['GITHUB_SHA'][:12],
              candidate_commit=os.environ['GITHUB_SHA'],
              mechanistic_dir=trace_dir,
              verify_parity=True,
          )
          write_report(report, output / 'report.json')

          trace_paths = sorted(
              path for path in trace_dir.glob('*.json')
              if path.name != 'diagnosis.json'
          )
          if len(trace_paths) != 1000:
              raise SystemExit(f'expected 1000 task traces, found {len(trace_paths)}')
          traces = {}
          for path in trace_paths:
              trace = json.loads(path.read_text(encoding='utf-8'))
              validate_trace(trace)
              traces[path.stem] = trace
          if report['mechanistic']['trace_count'] != 1000:
              raise SystemExit('aggregate trace count mismatch')
          if report['mechanistic']['parity_count'] != 1000:
              raise SystemExit('compact/mechanistic parity count mismatch')

          baseline = json.loads(
              Path('/tmp/arc-v2-2-baseline/report.json').read_text(encoding='utf-8')
          )
          baseline_rows = {
              item['task_id']: int(item['metrics']['correct'])
              for item in baseline['reports']
          }
          current_rows = {
              item['task_id']: int(item['metrics']['correct'])
              for item in report['reports']
          }
          lost_rows = {
              task_id: {
                  'baseline_correct': correct,
                  'current_correct': current_rows.get(task_id, 0),
              }
              for task_id, correct in baseline_rows.items()
              if current_rows.get(task_id, 0) < correct
          }
          gained_rows = {
              task_id: {
                  'baseline_correct': baseline_rows.get(task_id, 0),
                  'current_correct': correct,
              }
              for task_id, correct in current_rows.items()
              if correct > baseline_rows.get(task_id, 0)
          }
          expected_gains = {
              'aabf363d': {'baseline_correct': 0, 'current_correct': 1},
              'b230c067': {'baseline_correct': 0, 'current_correct': 1},
          }
          if lost_rows:
              raise SystemExit('lost baseline-correct rows: ' + json.dumps(lost_rows, sort_keys=True))
          if gained_rows != expected_gains:
              raise SystemExit(
                  'unexpected gained rows: expected '
                  + json.dumps(expected_gains, sort_keys=True)
                  + ' found '
                  + json.dumps(gained_rows, sort_keys=True)
              )

          expected_metrics = {
              'rows': 1076,
              'correct': 61,
              'accepted': 61,
              'incorrect_attempts': 0,
          }
          for key, expected in expected_metrics.items():
              if int(report['metrics'][key]) != expected:
                  raise SystemExit(
                      f'metric {key} changed: expected {expected}, found {report["metrics"][key]}'
                  )
          expected_status = {
              'ACCEPTED': 61,
              'GRAMMAR_EXHAUSTED': 1015,
          }
          if report['status_counts'] != expected_status:
              raise SystemExit(
                  'status counts changed: expected '
                  + json.dumps(expected_status, sort_keys=True)
                  + ' found '
                  + json.dumps(report['status_counts'], sort_keys=True)
              )

          aab = traces['aabf363d']
          aab_events = aab['events']
          aab_color_failures = [
              event for event in aab_events
              if event.get('event') == 'hidden_execution'
              and event.get('candidate_kind') == 'color_map'
              and event.get('outcome') == 'FAILED'
              and event.get('exception_type') == 'KeyError'
              and 'unmapped grid cell' in event.get('exception_message', '')
          ]
          aab_marker_successes = [
              event for event in aab_events
              if event.get('event') == 'hidden_execution'
              and event.get('candidate_kind') == 'marker_recolor'
              and event.get('outcome') == 'SUCCEEDED'
          ]
          aab_final = [event for event in aab_events if event.get('event') == 'final_decision'][0]
          if aab['terminal_status'] != 'ACCEPTED':
              raise SystemExit('aabf363d regressed from ACCEPTED')
          if len(aab_color_failures) != 1 or len(aab_marker_successes) != 2:
              raise SystemExit('aabf363d causal ledger changed')
          if not str(aab_final.get('selected_candidate_id', '')).startswith('marker_recolor:'):
              raise SystemExit('aabf363d selected primitive changed')

          b230 = traces['b230c067']
          b230_events = b230['events']
          rank_failures = [
              event for event in b230_events
              if event.get('event') == 'hidden_execution'
              and event.get('candidate_kind') == 'component_rank_color'
              and event.get('outcome') == 'FAILED'
              and event.get('exception_type') == 'KeyError'
              and 'unmapped component rank' in event.get('exception_message', '')
          ]
          outlier_failures = [
              event for event in b230_events
              if event.get('event') == 'hidden_execution'
              and event.get('candidate_kind') == 'component_area_outlier_color'
              and event.get('outcome') == 'FAILED'
              and event.get('exception_type') == 'ValueError'
              and 'component peer areas must be uniform' in event.get('exception_message', '')
          ]
          outlier_successes = [
              event for event in b230_events
              if event.get('event') == 'hidden_execution'
              and event.get('candidate_kind') == 'component_area_outlier_color'
              and event.get('outcome') == 'SUCCEEDED'
          ]
          b230_final = [event for event in b230_events if event.get('event') == 'final_decision'][0]
          if b230['terminal_status'] != 'ACCEPTED':
              raise SystemExit('b230c067 did not transition to ACCEPTED')
          if len(rank_failures) != 2:
              raise SystemExit(f'b230c067 expected two rank failures, found {len(rank_failures)}')
          if len(outlier_failures) != 1:
              raise SystemExit(f'b230c067 expected one outlier rejection, found {len(outlier_failures)}')
          if len(outlier_successes) != 1:
              raise SystemExit(f'b230c067 expected one outlier success, found {len(outlier_successes)}')
          if not str(b230_final.get('selected_candidate_id', '')).startswith('component_outlier:'):
              raise SystemExit('b230c067 did not select component outlier')

          transitions = {
              'schema_version': 1,
              'candidate_commit': os.environ['GITHUB_SHA'],
              'baseline_commit': 'e50965009efb96457fd769d97b42027f8a4e98c0',
              'lost_rows': lost_rows,
              'gained_rows': gained_rows,
              'expected_gains_matched': True,
              'incorrect_attempts': int(report['metrics']['incorrect_attempts']),
          }
          (output / 'transitions.json').write_text(
              json.dumps(transitions, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          parity = {
              'schema_version': 1,
              'candidate_commit': os.environ['GITHUB_SHA'],
              'checked_tasks': 1000,
              'mismatches': 0,
              'lost_baseline_rows': lost_rows,
          }
          (output / 'parity.json').write_text(
              json.dumps(parity, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          mechanisms = {
              'schema_version': 1,
              'aabf363d': {
                  'terminal_status': aab['terminal_status'],
                  'trace_digest': aab['trace_digest'],
                  'preserved_color_map_failure_count': len(aab_color_failures),
                  'marker_success_count': len(aab_marker_successes),
                  'selected_candidate_id': aab_final['selected_candidate_id'],
              },
              'b230c067': {
                  'terminal_status': b230['terminal_status'],
                  'trace_digest': b230['trace_digest'],
                  'preserved_rank_failure_count': len(rank_failures),
                  'four_connected_rejection_count': len(outlier_failures),
                  'eight_connected_success_count': len(outlier_successes),
                  'invariant': 'one unique area extreme and uniform-area peers',
                  'selected_candidate_id': b230_final['selected_candidate_id'],
              },
          }
          (output / 'mechanisms.json').write_text(
              json.dumps(mechanisms, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )

          print(json.dumps({
              'report_digest': report['report_digest'],
              'diagnosis_digest': report['mechanistic']['diagnosis_digest'],
              'evaluated_tasks': report['evaluated_tasks'],
              'trace_count': report['mechanistic']['trace_count'],
              'parity_count': report['mechanistic']['parity_count'],
              'metrics': report['metrics'],
              'status_counts': report['status_counts'],
              'transitions': transitions,
              'mechanisms': mechanisms,
          }, sort_keys=True))
          PY
      - name: Build checksum manifest after all writers close
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          output = Path('/tmp/arc-v2-2-outlier')
          lines = []
          for path in sorted(
              item for item in output.rglob('*')
              if item.is_file() and item.name != 'SHA256SUMS'
          ):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {path.relative_to(output).as_posix()}')
          (output / 'SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Verify checksum manifest independently
        working-directory: /tmp/arc-v2-2-outlier
        run: sha256sum -c SHA256SUMS
      - name: Publish component-outlier evidence
        uses: actions/upload-artifact@v4
        with:
          name: arc-v2-2-outlier-${{ github.sha }}
          path: /tmp/arc-v2-2-outlier
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Write run summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/arc-v2-2-outlier')
          report = json.loads((root / 'report.json').read_text())
          mechanisms = json.loads((root / 'mechanisms.json').read_text())
          lines = [
              '# ARC V2.2 component-outlier corpus',
              '',
              f"- Candidate: `{report['identity']['candidate_commit']}`",
              f"- Report digest: `{report['report_digest']}`",
              f"- Diagnosis digest: `{report['mechanistic']['diagnosis_digest']}`",
              f"- Metrics: `{report['metrics']}`",
              f"- Status counts: `{report['status_counts']}`",
              f"- b230c067 invariant: `{mechanisms['b230c067']['invariant']}`",
              '- Public ARC evaluation rerun: `no`',
          ]
          Path('/tmp/outlier-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat /tmp/outlier-summary.md >> "$GITHUB_STEP_SUMMARY"
