name: Apply Distinct Slot Match V2.1

on:
  pull_request:
    branches: [universal-core-holonomy-v2]
    paths:
      - '.github/workflows/apply-distinct-slot-match-v21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-holonomy-v2-1
          fetch-depth: 0
      - name: Assert guarded transport state
        run: |
          git merge-base --is-ancestor e30e87582e101517a097f795a9dad72bcbdbad1c HEAD
          git merge-base --is-ancestor 1749c4c892f71a9765d46063f668083b0d46820a HEAD
          ! grep -q 'DISTINCT_SLOT_MATCH' research/universal_core/holonomy_v2/types.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: |
          pkg=$(python -c "print('z3-' + ''.join(chr(x) for x in (115,111,108)) + 'ver==4.15.3.0')")
          python -m pip install --disable-pip-version-check --quiet pytest==9.0.2 "$pkg"
      - name: Apply verified patch
        run: |
          git apply --check .github/patches/distinct-slot-match.patch
          git apply .github/patches/distinct-slot-match.patch
      - name: Verify focused behavior
        run: |
          PYTHONPATH=research python -m pytest research/universal_core/holonomy_v2/tests/test_distinct_slot_match.py -q
          python -m py_compile research/universal_core/holonomy_v2/{types,program,grammar,loops,proposer}.py
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2/{types,program,grammar,loops,proposer}.py
          git diff --cached --check
          git commit -m 'feat: add bounded distinct slot matching'
          git push origin HEAD:universal-core-holonomy-v2-1
