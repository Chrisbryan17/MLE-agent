name: ARC Marker Recolor RED

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-marker-recolor-red.yml'

permissions:
  contents: write

jobs:
  verify-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Require missing marker module
        run: |
          set +e
          python -m pytest -q research/universal_core/holonomy_v2_2/tests/test_marker_recolor.py > /tmp/marker-red.log 2>&1
          status=$?
          set -e
          cat /tmp/marker-red.log
          test "$status" -ne 0
          grep -F "No module named 'research.universal_core.holonomy_v2_2.marker_recolor'" /tmp/marker-red.log
      - name: Commit RED evidence
        env:
          RED_SOURCE_SHA: ${{ github.sha }}
          RED_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              'schema_version': 1,
              'red_commit': os.environ['RED_SOURCE_SHA'],
              'red_run_id': os.environ['RED_RUN_ID'],
              'test_command': 'python -m pytest -q research/universal_core/holonomy_v2_2/tests/test_marker_recolor.py',
              'expected_failure': "ModuleNotFoundError: No module named 'research.universal_core.holonomy_v2_2.marker_recolor'",
              'failure_confirmed': True,
              'captured_log': Path('/tmp/marker-red.log').read_text(encoding='utf-8'),
              'source_trace': {
                  'task_id': 'aabf363d',
                  'trace_digest': '29544f72d9511885b6ea71838162ee86d83437198841c2e4815a5ffb824f54e4',
                  'failure': "color_map KeyError: 'unmapped grid cell'",
              },
              'frozen_core_commit': '1d7c489bcdbff755d638b35ad47ce62bd4fe829d',
          }
          path = Path('research/universal_core/holonomy_v2_2/evidence/MARKER_RECOLOR_RED.json')
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2_2/evidence/MARKER_RECOLOR_RED.json
          git commit -m 'arc: record marker recolor RED evidence'
          git push origin HEAD:universal-core-arc-training-v2-2
