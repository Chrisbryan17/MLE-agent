name: Wire ARC Ray Extension

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-ray-extend-wire.yml'

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Apply guarded ray integration
        run: |
          python - <<'PY'
          from pathlib import Path

          grid_path = Path('research/universal_core/holonomy_v2_2/grid_induction.py')
          text = grid_path.read_text(encoding='utf-8')
          import_anchor = 'from .symmetry_complete import apply_symmetry_complete\n'
          if text.count(import_anchor) != 1 or 'from .ray_extend import' in text:
              raise SystemExit('ray import anchor mismatch')
          text = text.replace(
              import_anchor,
              import_anchor + 'from .ray_extend import apply_ray_extend\n',
              1,
          )
          if text.count('_VERSION = "grid-v2.2-16"') != 1:
              raise SystemExit('ray version anchor mismatch')
          text = text.replace('_VERSION = "grid-v2.2-16"', '_VERSION = "grid-v2.2-17"', 1)
          apply_anchor = '    if kind == "reflective_symmetry_complete":\n'
          if text.count(apply_anchor) != 1:
              raise SystemExit('ray apply anchor mismatch')
          text = text.replace(
              apply_anchor,
              '    if kind == "anchor_ray_extend":\n'
              '        return apply_ray_extend(program, grid)\n'
              + apply_anchor,
              1,
          )
          grid_path.write_text(text, encoding='utf-8')

          runtime_path = Path('research/universal_core/holonomy_v2_2/grid_mechanistic_runtime.py')
          text = runtime_path.read_text(encoding='utf-8')
          import_anchor = 'from .symmetry_complete import symmetry_complete_programs\n'
          if text.count(import_anchor) != 1 or 'ray_extend_programs' in text:
              raise SystemExit('ray runtime import anchor mismatch')
          text = text.replace(
              import_anchor,
              import_anchor + 'from .ray_extend import ray_extend_programs\n',
              1,
          )
          derive_anchor = '    symmetry_complete, symmetry_reason = symmetry_complete_programs(demos)\n'
          if text.count(derive_anchor) != 1:
              raise SystemExit('ray derivation anchor mismatch')
          text = text.replace(
              derive_anchor,
              derive_anchor + '    ray_extend, ray_reason = ray_extend_programs(demos)\n',
              1,
          )
          batch_anchor = '        ("symmetry_complete", symmetry_complete, symmetry_reason),\n'
          if text.count(batch_anchor) != 1:
              raise SystemExit('ray batch anchor mismatch')
          text = text.replace(
              batch_anchor,
              batch_anchor + '        ("ray_extend", ray_extend, ray_reason),\n',
              1,
          )
          runtime_path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile \
            research/universal_core/holonomy_v2_2/ray_extend.py \
            research/universal_core/holonomy_v2_2/grid_induction.py \
            research/universal_core/holonomy_v2_2/grid_mechanistic_runtime.py
          git diff --check
      - name: Run focused ray regression set
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            research/universal_core/holonomy_v2_2/tests/test_ray_extend_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_ray_extend.py \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_symmetry_complete.py \
            research/universal_core/holonomy_v2_2/tests/test_line_connect_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_line_connect.py \
            research/universal_core/holonomy_v2_2/tests/test_gravity_compact_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_gravity_compact.py \
            research/universal_core/holonomy_v2_2/tests/test_block_reduce_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_block_reduce.py \
            research/universal_core/holonomy_v2_2/tests/test_axis_collapse_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_axis_collapse.py \
            research/universal_core/holonomy_v2_2/tests/test_palette_repeat_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_palette_repeat.py \
            research/universal_core/holonomy_v2_2/tests/test_quadrant_mosaic_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_quadrant_mosaic.py \
            research/universal_core/holonomy_v2_2/tests/test_mirror_concat.py \
            research/universal_core/holonomy_v2_2/tests/test_bbox_complete.py \
            research/universal_core/holonomy_v2_2/tests/test_component_outlier.py \
            research/universal_core/holonomy_v2_2/tests/test_marker_recolor.py \
            research/universal_core/holonomy_v2_2/tests/test_grid_mechanistic.py \
            research/universal_core/holonomy_v2_2/tests/test_grid_induction.py::test_cell_scale_and_whole_grid_tile_are_distinct \
            | tee /tmp/ray-focused.log
      - name: Run all V2.2 tests
        id: cluster
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q research/universal_core/holonomy_v2_2/tests | tee /tmp/ray-v2-2.log
      - name: Run frozen V2 integration tests
        id: frozen
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: research
        run: |
          set -o pipefail
          python -m pytest -q \
            research/universal_core/holonomy_v2/tests/test_blind_adapter.py \
            research/universal_core/holonomy_v2/tests/test_engine.py | tee /tmp/ray-frozen.log
      - name: Confirm frozen V2 bytes are unchanged
        id: byte_gate
        if: always()
        continue-on-error: true
        run: git diff --quiet 1d7c489bcdbff755d638b35ad47ce62bd4fe829d -- research/universal_core/holonomy_v2
      - name: Record result and commit only valid state
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          CLUSTER_OUTCOME: ${{ steps.cluster.outcome }}
          FROZEN_OUTCOME: ${{ steps.frozen.outcome }}
          BYTE_OUTCOME: ${{ steps.byte_gate.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          outcomes = {
              'focused': os.environ['FOCUSED_OUTCOME'],
              'v2_2_cluster': os.environ['CLUSTER_OUTCOME'],
              'frozen_tests': os.environ['FROZEN_OUTCOME'],
              'frozen_byte_gate': os.environ['BYTE_OUTCOME'],
          }
          passed = all(value == 'success' for value in outcomes.values())
          evidence = {
              'schema_version': 1,
              'workflow_source_commit': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'passed': passed,
              'outcomes': outcomes,
              'focused_output': Path('/tmp/ray-focused.log').read_text(encoding='utf-8') if Path('/tmp/ray-focused.log').exists() else '',
              'v2_2_output': Path('/tmp/ray-v2-2.log').read_text(encoding='utf-8') if Path('/tmp/ray-v2-2.log').exists() else '',
              'frozen_output': Path('/tmp/ray-frozen.log').read_text(encoding='utf-8') if Path('/tmp/ray-frozen.log').exists() else '',
              'expected_new_exact_tasks': ['623ea044', 'd037b0a7'],
              'expected_cumulative_metrics': {
                  'rows': 1076,
                  'correct': 101,
                  'accepted': 101,
                  'incorrect_attempts': 0,
                  'failed': 0,
              },
              'expected_status_counts': {
                  'ACCEPTED': 101,
                  'AMBIGUOUS_PROGRAM': 2,
                  'GRAMMAR_EXHAUSTED': 973,
              },
              'frozen_core_commit': '1d7c489bcdbff755d638b35ad47ce62bd4fe829d',
              'public_arc_evaluation_rerun': False,
          }
          name = 'RAY_EXTEND_GREEN.json' if passed else 'RAY_EXTEND_DIAGNOSTIC.json'
          path = Path('research/universal_core/holonomy_v2_2/evidence') / name
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          Path('/tmp/ray-passed').write_text('1' if passed else '0', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$(cat /tmp/ray-passed)" = "1" ]; then
            git add \
              research/universal_core/holonomy_v2_2/grid_induction.py \
              research/universal_core/holonomy_v2_2/grid_mechanistic_runtime.py \
              research/universal_core/holonomy_v2_2/evidence/RAY_EXTEND_GREEN.json
            git commit -m 'arc: wire anchor ray extension'
          else
            git restore \
              research/universal_core/holonomy_v2_2/grid_induction.py \
              research/universal_core/holonomy_v2_2/grid_mechanistic_runtime.py
            git add research/universal_core/holonomy_v2_2/evidence/RAY_EXTEND_DIAGNOSTIC.json
            git commit -m 'arc: record ray extension diagnostic failure'
          fi
          git push origin HEAD:universal-core-arc-training-v2-2
          test "$(cat /tmp/ray-passed)" = "1"
