name: Trigger Stack Rewrite V2.1

on:
  pull_request:
    branches: [universal-core-holonomy-v2]
    paths:
      - '.github/workflows/trigger-stack-rewrite-v21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-holonomy-v2-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned runtime
        run: |
          pkg=$(python -c "print('z3-' + ''.join(chr(x) for x in (115,111,108)) + 'ver==4.15.3.0')")
          python -m pip install --disable-pip-version-check --quiet pytest==9.0.2 "$pkg"

      - name: Extract and apply deterministic patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/apply-stack-rewrite-v21.yml').read_text()
          block = dedent(source.split("          python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0])

          start = block.index("dispatch_old = '''")
          end = block.index("program.write_text(text)", start)
          replacement = r'''dispatch_marker = '    raise ValueError(f"unsupported node kind: {kind}")\n'
          dispatch_block = (
              '    if kind == "stack_rewrite":\n'
              '        if not isinstance(value, Mapping):\n'
              '            raise TypeError("stack-rewrite input must be a mapping")\n'
              '        return _stack_rewrite(data, value, context)\n'
          )
          if 'raise TypeError("stack-rewrite input must be a mapping")' not in text:
              if dispatch_marker not in text:
                  raise SystemExit('program dispatch marker missing')
              text = text.replace(dispatch_marker, dispatch_block + dispatch_marker, 1)
          '''
          block = block[:start] + dedent(replacement) + block[end:]

          start = block.index("candidate_old = '''")
          end = block.index("grammar.write_text(text)", start)
          replacement = r'''candidate_marker = '    priority = _priority_data(instructions, demos)\n'
          candidate_block = (
              '    for stack_rewrite in _stack_rewrite_candidates(instructions, demos):\n'
              '        _add_if_fits(candidates, stack_rewrite, demos)\n'
              '\n'
          )
          if 'for stack_rewrite in _stack_rewrite_candidates' not in text:
              if candidate_marker not in text:
                  raise SystemExit('grammar candidate marker missing')
              text = text.replace(candidate_marker, candidate_block + candidate_marker, 1)
          '''
          block = block[:start] + dedent(replacement) + block[end:]

          start = block.index("loop_marker = '    if data.get")
          end = block.index("loops.write_text(text)", start)
          replacement = r'''loop_marker = '    if data.get("kind") == "compose":\n'
          loop_block = (
              '    if data.get("kind") == "stack_rewrite":\n'
              '        for index, demo in enumerate(demos[:3]):\n'
              '            inp, expected = _demo_parts(demo)\n'
              '            if not isinstance(inp, Mapping):\n'
              '                continue\n'
              '            normal_input = deepcopy(dict(inp))\n'
              '            normal_input[data["sequence_field"]] = deepcopy(expected)\n'
              '            mandatory.append(ClosedPath(\n'
              '                LoopKind.REWRITE_NORMAL_FORM,\n'
              '                True,\n'
              '                normal_input,\n'
              '                deepcopy(expected),\n'
              '                data,\n'
              '                f"rewrite-normal-form-{index}",\n'
              '            ))\n'
              '\n'
          )
          if 'LoopKind.REWRITE_NORMAL_FORM' not in text:
              if loop_marker not in text:
                  raise SystemExit('loop marker missing')
              text = text.replace(loop_marker, loop_block + loop_marker, 1)
          '''
          block = block[:start] + dedent(replacement) + block[end:]

          start = block.index("constants_old = '''")
          end = block.index("proposer.write_text(text)", start)
          replacement = r'''constants_marker = '        for key, item in data.items():\n'
          constants_block = (
              '        elif kind == "stack_rewrite":\n'
              '            for rule in data.get("rules", ()):\n'
              '                values.extend(rule.get("left", ()))\n'
              '                values.extend(rule.get("right", ()))\n'
          )
          if 'elif kind == "stack_rewrite":' not in text:
              if constants_marker not in text:
                  raise SystemExit('proposer constants marker missing')
              text = text.replace(constants_marker, constants_block + constants_marker, 1)
          '''
          block = block[:start] + dedent(replacement) + block[end:]

          Path('/tmp/apply_stack_rewrite.py').write_text(block)
          PY
          python /tmp/apply_stack_rewrite.py

      - name: Verify focused behavior
        run: |
          PYTHONPATH=research python -m pytest research/universal_core/holonomy_v2/tests/test_stack_rewrite.py -q
          python -m py_compile research/universal_core/holonomy_v2/types.py research/universal_core/holonomy_v2/program.py research/universal_core/holonomy_v2/grammar.py research/universal_core/holonomy_v2/loops.py research/universal_core/holonomy_v2/proposer.py

      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2/types.py research/universal_core/holonomy_v2/program.py research/universal_core/holonomy_v2/grammar.py research/universal_core/holonomy_v2/loops.py research/universal_core/holonomy_v2/proposer.py
          git diff --cached --check
          git commit -m 'feat: add bounded generic stack rewriting'
          git push origin HEAD:universal-core-holonomy-v2-1
