name: Cancel Stale Validation Runs

on:
  pull_request:
    branches:
      - universal-bbeh-guaranteed-close
    paths:
      - '.github/workflows/cancel-stale-validation-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete duplicate runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euxo pipefail
          for RUN_ID in \
            29198729053 \
            29199747387 \
            29202008045 \
            29206325046 \
            29206410595 \
            29207745652
          do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/cancel" \
              || true
          done
