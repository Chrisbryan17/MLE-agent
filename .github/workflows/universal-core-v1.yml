name: Universal Core V1

on:
  pull_request:
    paths:
      - 'research/universal_core/**'
      - 'docs/superpowers/specs/2026-07-29-universal-core-v1-design.md'
      - 'docs/superpowers/plans/2026-07-29-universal-core-v1.md'
      - '.github/workflows/universal-core-v1.yml'
  push:
    branches: [universal-core-v1]
  workflow_dispatch:

concurrency:
  group: universal-core-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch immutable archive reference
        run: |
          git fetch --no-tags origin \
            archive/universal-bbeh-dual-track-4520-2026-07-28:refs/remotes/origin/archive/universal-bbeh-dual-track-4520-2026-07-28
          test "$(git rev-parse refs/remotes/origin/archive/universal-bbeh-dual-track-4520-2026-07-28)" = \
            "a0c099a41c85f267ca6323235a019b2052107873"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check --quiet pytest==9.0.2 z3-solver==4.15.3.0

      - name: Prepare evidence directories
        run: mkdir -p artifacts

      - name: Record runtime environment
        run: |
          PYTHONPATH=research python - <<'PY'
          import json, platform, sys
          import pytest, z3
          from pathlib import Path
          payload = {
              "python": platform.python_version(),
              "implementation": platform.python_implementation(),
              "pytest": pytest.__version__,
              "z3": z3.get_version_string(),
              "executable": sys.executable,
          }
          Path("artifacts/environment.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run complete Universal Core test suite
        run: |
          PYTHONPATH=research python -m pytest research/universal_core/tests -q \
            --junitxml=artifacts/pytest.xml

      - name: Verify archived system identity and non-deletion
        run: |
          PYTHONPATH=research python -m universal_core.archive_guard \
            | tee artifacts/archive-verification.json

      - name: Generate fixed release-gate evidence
        run: |
          PYTHONPATH=research python -m universal_core.tests.run_release_gates \
            --output artifacts/release-gates.json \
            --work-dir artifacts/generated-runs

      - name: Reproduce sealed sample twice
        run: |
          PYTHONPATH=research python -m universal_core.cli run \
            --task research/universal_core/tests/fixtures/sort_records.json \
            --output artifacts/sample-a \
            | tee artifacts/sample-a-summary.json
          PYTHONPATH=research python -m universal_core.cli run \
            --task research/universal_core/tests/fixtures/sort_records.json \
            --output artifacts/sample-b \
            | tee artifacts/sample-b-summary.json
          diff -ru artifacts/sample-a/attempts/attempt-0001 \
                   artifacts/sample-b/attempts/attempt-0001 \
            > artifacts/replay-verification.txt
          printf 'byte-identical sealed replay\n' >> artifacts/replay-verification.txt

      - name: Scan production source for prohibited mechanisms
        run: |
          PYTHONPATH=research python - <<'PY'
          from pathlib import Path
          forbidden = {
              "dynamic-eval": "eval" + "(",
              "dynamic-exec": "exec" + "(",
              "benchmark-route": "bbeh_",
              "target-ledger": "correction_ledger",
              "row-answer-lookup": "input_hash_answer",
              "test-generator-import": "tests.generators",
          }
          failures = []
          for path in sorted(Path("research/universal_core").glob("*.py")):
              source = path.read_text(encoding="utf-8")
              for label, token in forbidden.items():
                  if token in source:
                      failures.append(f"{label}: {path}: {token}")
          if failures:
              raise SystemExit("\n".join(failures))
          Path("artifacts/prohibited-mechanism-scan.txt").write_text(
              "zero prohibited mechanisms found\n", encoding="utf-8"
          )
          PY

      - name: Build evidence SHA-256 manifest
        run: |
          PYTHONPATH=research python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("artifacts")
          manifest = {
              path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(root.rglob("*"))
              if path.is_file() and path.name != "SHA256.json"
          }
          (root / "SHA256.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          for relative, expected in manifest.items():
              assert hashlib.sha256((root / relative).read_bytes()).hexdigest() == expected
          print(json.dumps({"manifest_entries": len(manifest)}, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: universal-core-v1-evidence
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30
