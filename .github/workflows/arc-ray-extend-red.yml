name: ARC Ray Extension RED

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-ray-extend-red.yml'

permissions:
  contents: write

jobs:
  verify-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Verify pinned ray fixtures
        run: python -m pytest -q research/universal_core/holonomy_v2_2/tests/test_ray_extend_fixtures.py
      - name: Require missing ray module
        run: |
          set +e
          python -m pytest -q research/universal_core/holonomy_v2_2/tests/test_ray_extend.py > /tmp/ray-red.log 2>&1
          status=$?
          set -e
          cat /tmp/ray-red.log
          test "$status" -ne 0
          grep -F "No module named 'research.universal_core.holonomy_v2_2.ray_extend'" /tmp/ray-red.log
      - name: Verify frozen V2.1 byte identity
        run: git diff --quiet 1d7c489bcdbff755d638b35ad47ce62bd4fe829d -- research/universal_core/holonomy_v2
      - name: Commit RED evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'schema_version': 1,
              'source_commit': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'failure_confirmed': True,
              'fixture_integrity': True,
              'expected_failure': "ModuleNotFoundError: No module named 'research.universal_core.holonomy_v2_2.ray_extend'",
              'expected_new_exact_tasks': ['623ea044', 'd037b0a7'],
              'expected_cumulative_metrics': {
                  'rows': 1076,
                  'accepted': 101,
                  'correct': 101,
                  'incorrect_attempts': 0,
                  'failed': 0,
              },
              'expected_status_counts': {
                  'ACCEPTED': 101,
                  'AMBIGUOUS_PROGRAM': 2,
                  'GRAMMAR_EXHAUSTED': 973,
              },
              'captured_log': Path('/tmp/ray-red.log').read_text(encoding='utf-8'),
              'frozen_core_commit': '1d7c489bcdbff755d638b35ad47ce62bd4fe829d',
              'public_arc_evaluation_rerun': False,
          }
          path = Path('research/universal_core/holonomy_v2_2/evidence/RAY_EXTEND_RED.json')
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2_2/evidence/RAY_EXTEND_RED.json
          git commit -m 'arc: record ray extension RED evidence'
          git push origin HEAD:universal-core-arc-training-v2-2
