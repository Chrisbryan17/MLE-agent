name: Universal Temporal Exact V7

on:
  pull_request:
    branches:
      - universal-word-sort-exact-v6
    paths:
      - 'research/universal_validation/bbeh_temporal_exact_v7.py'
      - '.github/workflows/universal-temporal-exact-v7.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-temporal-exact-v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned BBEH
        run: |
          mkdir -p research/universal_validation/.external
          git clone https://github.com/google-deepmind/bbeh.git research/universal_validation/.external/bbeh
          git -C research/universal_validation/.external/bbeh checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
      - name: Evaluate repaired temporal compiler
        working-directory: research/universal_validation
        env:
          BBEH_TASK_ROOT: .external/bbeh/bbeh/benchmark_tasks
        run: |
          mkdir -p artifacts/temporal_exact_v7
          python -m py_compile bbeh_temporal_sequence_exact.py bbeh_temporal_exact_v7.py
          python bbeh_temporal_exact_v7.py 2>&1 | tee artifacts/temporal_exact_v7/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: universal-temporal-exact-v7
          path: |
            research/universal_validation/artifacts/temporal_exact_v7/**
            research/universal_validation/bbeh_temporal_exact_v7.py
          if-no-files-found: error
