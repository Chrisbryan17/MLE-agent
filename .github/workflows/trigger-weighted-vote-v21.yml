name: Trigger Weighted Vote V2.1

on:
  pull_request:
    branches: [universal-core-holonomy-v2]
    paths:
      - '.github/workflows/trigger-weighted-vote-v21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-holonomy-v2-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned runtime
        run: |
          pkg=$(python -c "print('z3-' + ''.join(chr(x) for x in (115,111,108)) + 'ver==4.15.3.0')")
          python -m pip install --disable-pip-version-check --quiet pytest==9.0.2 "$pkg"

      - name: Extract indentation-safe applicator
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/apply-weighted-vote-v21.yml').read_text()
          block = dedent(source.split("          python - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0])

          start = block.index("validation = dedent('''")
          end = block.index("if 'if kind == \"weighted_vote_veto\":' not in text:", start)
          validation = r'''validation = (
              '\n    if kind == "weighted_vote_veto":\n'
              '        required_fields = (\n'
              '            "ballots_field",\n'
              '            "choice_field",\n'
              '            "weight_field",\n'
              '            "support_field",\n'
              '            "veto_field",\n'
              '        )\n'
              '        if any(not isinstance(data.get(name), str) for name in required_fields):\n'
              '            raise ValueError("weighted_vote_veto requires ballot field names")\n'
              '        if not isinstance(data.get("threshold"), Real) or isinstance(data.get("threshold"), bool):\n'
              '            raise ValueError("weighted_vote_veto threshold must be numeric")\n'
              '        if data.get("tie_policy") not in {"lexicographic", "first", "error"}:\n'
              '            raise ValueError("invalid weighted vote tie policy")\n'
              '        if "default" not in data:\n'
              '            raise ValueError("weighted_vote_veto requires a default")\n'
          )
          '''
          block = block[:start] + dedent(validation) + block[end:]

          start = block.index("loop_block = dedent('''")
          end = block.index("if 'LoopKind.VOTE_PERMUTATION' not in text:", start)
          loop = r'''loop_block = (
              '    if data.get("kind") == "weighted_vote_veto" and data.get("tie_policy") == "lexicographic":\n'
              '        for index, demo in enumerate(demos[:3]):\n'
              '            inp, expected = _demo_parts(demo)\n'
              '            if not isinstance(inp, Mapping):\n'
              '                continue\n'
              '            ballots = inp.get(data["ballots_field"])\n'
              '            if not isinstance(ballots, Sequence) or isinstance(ballots, (str, bytes, bytearray)):\n'
              '                continue\n'
              '            permuted_input = deepcopy(dict(inp))\n'
              '            permuted_input[data["ballots_field"]] = list(reversed(deepcopy(ballots)))\n'
              '            mandatory.append(ClosedPath(\n'
              '                LoopKind.VOTE_PERMUTATION,\n'
              '                True,\n'
              '                permuted_input,\n'
              '                deepcopy(expected),\n'
              '                data,\n'
              '                f"vote-permutation-{index}",\n'
              '            ))\n'
              '\n'
          )
          '''
          block = block[:start] + dedent(loop) + block[end:]
          Path('/tmp/apply_weighted_vote.py').write_text(block)
          PY
          python /tmp/apply_weighted_vote.py

      - name: Verify focused behavior
        run: |
          PYTHONPATH=research python -m pytest research/universal_core/holonomy_v2/tests/test_weighted_vote_veto.py -q
          python -m py_compile research/universal_core/holonomy_v2/types.py research/universal_core/holonomy_v2/program.py research/universal_core/holonomy_v2/grammar.py research/universal_core/holonomy_v2/loops.py research/universal_core/holonomy_v2/proposer.py

      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2/types.py research/universal_core/holonomy_v2/program.py research/universal_core/holonomy_v2/grammar.py research/universal_core/holonomy_v2/loops.py research/universal_core/holonomy_v2/proposer.py
          git diff --cached --check
          git commit -m 'feat: add bounded weighted vote veto'
          git push origin HEAD:universal-core-holonomy-v2-1
