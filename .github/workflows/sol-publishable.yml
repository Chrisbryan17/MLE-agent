name: SOL Publishable Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'research/sol/**'
      - '.github/workflows/sol-publishable.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run official BIG-bench evaluation
        working-directory: research/sol
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          python -m py_compile sol_benchmark.py
          python sol_benchmark.py 2>&1 | tee artifacts/run.log
      - name: Preserve benchmark inputs and code hash
        working-directory: research/sol
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          payload = {
              'code_sha256': hashlib.sha256(pathlib.Path('sol_benchmark.py').read_bytes()).hexdigest(),
              'datasets': {
                  p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(pathlib.Path('.cache').glob('*.json'))
              },
          }
          pathlib.Path('artifacts/reproducibility.json').write_text(json.dumps(payload, indent=2))
          PY
      - name: Upload SOL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-publishable-evidence
          path: |
            research/sol/artifacts/**
            research/sol/sol_benchmark.py
          if-no-files-found: warn
