name: SOL BBH Alternative Jury

on:
  pull_request:
    branches:
      - main
    paths:
      - 'research/sol_bbh/alt_jury_smoke.py'
      - '.github/workflows/sol-bbh-alt-jury.yml'
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  alt-jury:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-bbh-eval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download BBH and evaluate alternative juries
        working-directory: research/sol_bbh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          python bbh_frontier.py >/dev/null
          python alt_jury_smoke.py 2>&1 | tee artifacts/alt_jury_smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol-bbh-alt-jury-smoke
          path: |
            research/sol_bbh/artifacts/alt_jury_smoke/**
            research/sol_bbh/artifacts/alt_jury_smoke.log
            research/sol_bbh/alt_jury_smoke.py
          if-no-files-found: error
