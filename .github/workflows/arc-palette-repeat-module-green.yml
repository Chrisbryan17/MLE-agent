name: ARC Palette Repeat Module GREEN

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-palette-repeat-module-green.yml'

permissions:
  contents: write

jobs:
  verify-module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Run isolated palette tests
        run: |
          python -m pytest -q \
            research/universal_core/holonomy_v2_2/tests/test_palette_repeat_fixtures.py \
            research/universal_core/holonomy_v2_2/tests/test_palette_repeat.py::test_apply_scales_by_total_palette_size \
            research/universal_core/holonomy_v2_2/tests/test_palette_repeat.py::test_apply_tiles_by_total_palette_size \
            research/universal_core/holonomy_v2_2/tests/test_palette_repeat.py::test_apply_scales_by_non_background_palette_size \
            research/universal_core/holonomy_v2_2/tests/test_palette_repeat.py::test_program_derivation_requires_demonstrated_factor_variation \
            research/universal_core/holonomy_v2_2/tests/test_palette_repeat.py::test_program_derivation_defers_constant_factor_to_fixed_grammar \
            research/universal_core/holonomy_v2_2/tests/test_palette_repeat.py::test_apply_rejects_output_beyond_arc_bounds \
            | tee /tmp/module-green.log
      - name: Confirm frozen bytes
        run: git diff --quiet 1d7c489bcdbff755d638b35ad47ce62bd4fe829d -- research/universal_core/holonomy_v2
      - name: Commit module evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'schema_version': 1,
              'source_commit': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'passed': True,
              'test_count': 7,
              'test_output': Path('/tmp/module-green.log').read_text(encoding='utf-8'),
              'frozen_core_commit': '1d7c489bcdbff755d638b35ad47ce62bd4fe829d',
              'frozen_byte_gate': True,
              'public_arc_evaluation_rerun': False,
          }
          path = Path('research/universal_core/holonomy_v2_2/evidence/PALETTE_REPEAT_MODULE_GREEN.json')
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2_2/evidence/PALETTE_REPEAT_MODULE_GREEN.json
          git commit -m 'arc: record palette repeat module GREEN'
          git push origin HEAD:universal-core-arc-training-v2-2
