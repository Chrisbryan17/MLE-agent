name: Public Benchmark Snapshot

on:
  push:
    branches:
      - universal-core-public-benchmarks-v1
    paths:
      - '.github/workflows/public-benchmark-snapshot.yml'
      - 'research/universal_core/public_benchmarks/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-benchmark-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[benchmark snapshot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-public-benchmarks-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install snapshot dependencies
        run: python -m pip install --disable-pip-version-check --quiet pytest datasets huggingface_hub pyarrow
      - name: Run focused regression tests
        run: python -m pytest -q research/universal_core/public_benchmarks/tests
      - name: Fetch or verify immutable snapshot
        run: |
          if test -f research/universal_core/public_benchmarks/vendor/SNAPSHOT_MANIFEST.json; then
            python -m research.universal_core.public_benchmarks.snapshot verify | tee /tmp/public-benchmark-summary.json
          else
            python -m research.universal_core.public_benchmarks.snapshot fetch | tee /tmp/public-benchmark-summary.json
            python -m research.universal_core.public_benchmarks.snapshot verify
          fi
      - name: Commit first snapshot
        run: |
          if git status --porcelain -- research/universal_core/public_benchmarks/vendor | grep -q .; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add research/universal_core/public_benchmarks/vendor
            git commit -m '[benchmark snapshot] import pinned ARC-AGI-2, BBEH, and LiveBench data'
            git push origin HEAD:universal-core-public-benchmarks-v1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: public-benchmark-snapshot
          path: |
            research/universal_core/public_benchmarks/sources.lock.json
            research/universal_core/public_benchmarks/vendor/**
            /tmp/public-benchmark-summary.json
          if-no-files-found: error
          retention-days: 90
