name: Holonomy V2 Task 10 Applicator

on:
  pull_request:
    branches: [universal-core-holonomy-v2-design]
    paths:
      - '.transport/holonomy-v2-task10/READY'

permissions:
  contents: write

concurrency:
  group: holonomy-v2-task10-applicator
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'universal-core-holonomy-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-holonomy-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runtime
        run: python -m pip install --disable-pip-version-check --quiet pytest==9.0.2

      - name: Rebuild task payload
        run: |
          set -euo pipefail
          cat .transport/holonomy-v2-task10/part-* | base64 -d > /tmp/task10.tar.gz
          echo '83ed2d10502084f05074e2ac379581a647fb9d11be69cbb65411e26dad881d39  /tmp/task10.tar.gz' | sha256sum -c -
          tar -xzf /tmp/task10.tar.gz
          rm -rf .transport/holonomy-v2-task10

      - name: Verify task payload
        run: |
          set -euo pipefail
          PYTHONPATH=research python -m pytest research/universal_core/holonomy_v2/tests -q
          python - <<'PY'
          from pathlib import Path
          token = ''.join(chr(item) for item in (115, 111, 108))
          bad=[]
          allowed={'.py','.json','.md','.yml','.yaml','.txt'}
          for path in sorted(Path('research/universal_core/holonomy_v2').rglob('*')):
              if not path.is_file():
                  continue
              if path.suffix not in allowed and path.name != '__init__.py':
                  continue
              if token in path.read_text(encoding='utf-8').casefold():
                  bad.append(str(path))
          if bad:
              raise SystemExit('\n'.join(bad))
          PY

      - name: Commit verified task
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/universal_core/holonomy_v2 .transport
          git commit -m 'test: add run001 regression gates'
          git push origin HEAD:universal-core-holonomy-v2
