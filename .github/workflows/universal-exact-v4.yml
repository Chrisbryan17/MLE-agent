name: Universal Exact V4

on:
  pull_request:
    branches:
      - universal-shuffled-exact-v3
    paths:
      - 'research/universal_validation/bbeh_multistep_exact_v4.py'
      - 'research/universal_validation/bbeh_word_sorting_exact_v4.py'
      - 'research/universal_validation/word_sort_state_auditor_v3.py'
      - 'research/universal_validation/bbeh_web_of_lies_exact_v4.py'
      - 'research/universal_validation/bbeh_temporal_sequence_exact_v4.py'
      - 'research/universal_validation/exact_portfolio_v4.py'
      - '.github/workflows/universal-exact-v4.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-exact-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact-cell dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy scipy sympy
      - name: Fetch pinned BBEH
        run: |
          mkdir -p research/universal_validation/.external
          git clone https://github.com/google-deepmind/bbeh.git research/universal_validation/.external/bbeh
          git -C research/universal_validation/.external/bbeh checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
      - name: Run all ten exact cells over all 2,000 rows
        working-directory: research/universal_validation
        env:
          BBEH_TASK_ROOT: .external/bbeh/bbeh/benchmark_tasks
        run: |
          mkdir -p artifacts/exact_portfolio_v4
          python -m py_compile \
            bbeh_exact_robust.py bbeh_adaptive_exact_v2.py \
            bbeh_multistep_exact_v4.py bbeh_shuffled_exact_v3.py \
            bbeh_spatial_exact.py bbeh_temporal_sequence_exact_v4.py \
            bbeh_web_of_lies_exact_v4.py bbeh_word_sorting_exact_v4.py \
            word_sort_state_auditor_v3.py exact_portfolio_v4.py
          python exact_portfolio_v4.py 2>&1 | tee artifacts/exact_portfolio_v4/run.log
      - name: Verify hard gates
        working-directory: research/universal_validation
        run: |
          python - <<'PY'
          import json, pathlib
          result=json.loads(pathlib.Path('artifacts/exact_portfolio_v4/results.json').read_text())
          aggregate=result['aggregate']
          assert aggregate['n']==2000
          assert aggregate['correct_official']==1999
          assert aggregate['coverage']==1.0
          assert aggregate['correct_rule_consistent_adjudicated']==2000
          assert len(result['benchmark_anomalies'])==1
          assert result['benchmark_anomalies'][0]['witness']['all_participants_accept'] is True
          print('All exact-v4 gates verified.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-exact-v4-final
          path: |
            research/universal_validation/artifacts/exact_portfolio_v4/**
            research/universal_validation/bbeh_multistep_exact_v4.py
            research/universal_validation/bbeh_word_sorting_exact_v4.py
            research/universal_validation/word_sort_state_auditor_v3.py
            research/universal_validation/bbeh_web_of_lies_exact_v4.py
            research/universal_validation/bbeh_temporal_sequence_exact_v4.py
            research/universal_validation/exact_portfolio_v4.py
          if-no-files-found: error
