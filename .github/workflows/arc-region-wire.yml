name: Wire ARC Enclosed Regions

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-region-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - name: Apply guarded integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('research/universal_core/holonomy_v2_2/grid_induction.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from .panel_combine import apply_panel, panel_candidates\n'
          import_value = import_anchor + 'from .region_fill import apply_region, region_candidates\n'
          if text.count(import_anchor) != 1 or 'from .region_fill import' in text:
              raise SystemExit('region import anchor mismatch')
          text = text.replace(import_anchor, import_value, 1)

          version_anchor = '_VERSION = "grid-v2.2-3"'
          if text.count(version_anchor) != 1:
              raise SystemExit('version anchor mismatch')
          text = text.replace(version_anchor, '_VERSION = "grid-v2.2-4"', 1)

          apply_anchor = '    if kind == "color_map":\n'
          apply_value = (
              '    if kind == "enclosed_region_fill":\n'
              '        return apply_region(program, grid)\n'
          )
          if text.count(apply_anchor) != 1:
              raise SystemExit('region apply anchor mismatch')
          text = text.replace(apply_anchor, apply_value + apply_anchor, 1)

          candidate_anchor = '    candidates.extend(panel_candidates(demos))\n'
          candidate_value = candidate_anchor + '    candidates.extend(region_candidates(demos))\n'
          if text.count(candidate_anchor) != 1:
              raise SystemExit('region candidate anchor mismatch')
          text = text.replace(candidate_anchor, candidate_value, 1)

          background_loop = '    for background in backgrounds:\n'
          background_value = (
              '    common_backgrounds = set(cell for row in demos[0][0] for cell in row)\n'
              '    for source, _ in demos[1:]:\n'
              '        common_backgrounds.intersection_update(cell for row in source for cell in row)\n'
              '    for background in sorted(common_backgrounds):\n'
          )
          if text.count(background_loop) != 1:
              raise SystemExit('component background loop mismatch')
          text = text.replace(background_loop, background_value, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- research/universal_core/holonomy_v2_2/grid_induction.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2_2/grid_induction.py
          git commit -m 'arc: wire enclosed region candidates'
          git push origin HEAD:universal-core-arc-training-v2-2
