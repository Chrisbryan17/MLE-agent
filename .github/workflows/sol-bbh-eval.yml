name: SOL BBH Isolated Eval

on:
  push:
    branches:
      - sol-bbh-eval
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-bbh-eval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture GPT-5 response shape
        working-directory: research/sol_bbh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python gpt5_probe.py
          cat gpt5_probe_response.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol-bbh-isolated-probe
          path: research/sol_bbh/gpt5_probe_response.json
          if-no-files-found: error
