name: Diagnose Recovery Bundle
on:
  push:
    branches: [universal-structured-residual-v1]
    paths:
      - '.github/workflows/diagnose-recovery-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery bundle
        run: python research/universal_validation/checkpoints/2026-07-27/restore_dual_track_source.py
