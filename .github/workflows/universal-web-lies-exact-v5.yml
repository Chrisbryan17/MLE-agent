name: Universal Web of Lies Exact V5

on:
  pull_request:
    branches:
      - universal-arithmetic-exact-v4
    paths:
      - 'research/universal_validation/bbeh_web_lies_exact_v5.py'
      - '.github/workflows/universal-web-lies-exact-v5.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-web-lies-exact-v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SAT dependency
        run: python -m pip install --disable-pip-version-check --quiet z3-solver
      - name: Fetch pinned BBEH
        run: |
          mkdir -p research/universal_validation/.external
          git clone https://github.com/google-deepmind/bbeh.git research/universal_validation/.external/bbeh
          git -C research/universal_validation/.external/bbeh checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
      - name: Evaluate exact truth-and-lies compiler
        working-directory: research/universal_validation
        env:
          BBEH_TASK_ROOT: .external/bbeh/bbeh/benchmark_tasks
        run: |
          mkdir -p artifacts/web_lies_exact_v5
          python -m py_compile bbeh_web_lies_exact_v5.py
          python bbeh_web_lies_exact_v5.py 2>&1 | tee artifacts/web_lies_exact_v5/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: universal-web-lies-exact-v5
          path: |
            research/universal_validation/artifacts/web_lies_exact_v5/**
            research/universal_validation/bbeh_web_lies_exact_v5.py
          if-no-files-found: error
