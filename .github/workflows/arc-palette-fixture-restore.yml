name: Restore ARC Palette Fixtures

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-palette-fixture-restore.yml'

permissions:
  contents: write
  actions: read

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable benchmark corpus
        uses: actions/download-artifact@v4
        with:
          name: public-benchmarks-pinned-2026-08-04
          path: /tmp/pinned-public-benchmarks
          github-token: ${{ github.token }}
          repository: Chrisbryan17/MLE-agent
          run-id: '30929169392'
      - name: Restore exact fixture bytes
        run: |
          set -euo pipefail
          vendor=$(find /tmp/pinned-public-benchmarks -type d -path '*/arc_agi_2/data/training' | head -1)
          test -n "$vendor"
          destination=research/universal_core/holonomy_v2_2/tests/fixtures/palette_repeat
          mkdir -p "$destination"
          for task_id in a59b95c0 ac0a08a4 b91ae062 d4b1c2b1; do
            cp "$vendor/$task_id.json" "$destination/$task_id.json"
          done
          printf '%s  %s\n' \
            138f5638ba814834e4f222d6509665ea091c36be6bfc9305fdf41fecd72c41a1 "$destination/a59b95c0.json" \
            5e68feb78f2f5405be84063528e4beab2b66b8b8cbdac211e305d75e8ac8703d "$destination/ac0a08a4.json" \
            dfb1b3e1b6d275cb1830c1d42320358a1ddc45a925504904ff07fa0dac8a2a53 "$destination/b91ae062.json" \
            46b0f9fec811ac831b916e44ef8269e45e2b054d59354a4a8f8a1a299716d753 "$destination/d4b1c2b1.json" \
            | sha256sum -c -
      - run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Verify fixture regression
        run: python -m pytest -q research/universal_core/holonomy_v2_2/tests/test_palette_repeat_fixtures.py | tee /tmp/fixture-green.log
      - name: Commit exact fixtures and evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'schema_version': 1,
              'workflow_source_commit': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'fixture_count': 4,
              'fixture_integrity': True,
              'source_artifact_run': 30929169392,
              'test_output': Path('/tmp/fixture-green.log').read_text(encoding='utf-8'),
              'public_arc_evaluation_rerun': False,
          }
          path = Path('research/universal_core/holonomy_v2_2/evidence/PALETTE_FIXTURE_INTEGRITY_GREEN.json')
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            research/universal_core/holonomy_v2_2/tests/fixtures/palette_repeat \
            research/universal_core/holonomy_v2_2/evidence/PALETTE_FIXTURE_INTEGRITY_GREEN.json
          git commit -m 'arc: restore pinned palette repeat fixtures'
          git push origin HEAD:universal-core-arc-training-v2-2
