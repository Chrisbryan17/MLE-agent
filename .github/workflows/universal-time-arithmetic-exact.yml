name: Universal Time Arithmetic Exact

on:
  pull_request:
    branches:
      - universal-object-properties-exact-v1
    paths:
      - 'research/universal_validation/bbeh_time_arithmetic_exact_v1.py.gz.b64'
      - 'research/universal_validation/bbeh_time_arithmetic_eval.py'
      - '.github/workflows/universal-time-arithmetic-exact.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-time-arithmetic-exact-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet python-dateutil
      - name: Fetch pinned BBEH
        run: |
          mkdir -p research/universal_validation/.external
          git clone https://github.com/google-deepmind/bbeh.git research/universal_validation/.external/bbeh
          git -C research/universal_validation/.external/bbeh checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
      - name: Evaluate typed temporal compiler
        working-directory: research/universal_validation
        env:
          BBEH_TASK_ROOT: .external/bbeh/bbeh/benchmark_tasks
        run: |
          mkdir -p artifacts/time_arithmetic_exact
          python -m py_compile bbeh_time_arithmetic_eval.py
          python bbeh_time_arithmetic_eval.py 2>&1 | tee artifacts/time_arithmetic_exact/run.log
      - name: Seal artifact hashes
        working-directory: research/universal_validation
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('artifacts/time_arithmetic_exact')
          (root/'SHA256.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-time-arithmetic-exact
          path: |
            research/universal_validation/artifacts/time_arithmetic_exact/**
            research/universal_validation/bbeh_time_arithmetic_exact_v1.py.gz.b64
            research/universal_validation/bbeh_time_arithmetic_eval.py
          if-no-files-found: error
