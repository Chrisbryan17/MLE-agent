name: SOL BBH Frontier

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'research/sol/**'
      - 'research/sol_bbh/**'
      - '.github/workflows/sol-bbh-frontier.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete official BBH suite
        working-directory: research/sol_bbh
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          python -m py_compile bbh_frontier.py
          python bbh_frontier.py 2>&1 | tee artifacts/run.log
      - name: Preserve code and data hashes
        working-directory: research/sol_bbh
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          payload = {
              'code': {
                  'bbh_frontier.py': hashlib.sha256(pathlib.Path('bbh_frontier.py').read_bytes()).hexdigest(),
              },
              'bbh': {
                  p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(pathlib.Path('.bbh_cache').glob('*.json'))
              },
          }
          pathlib.Path('artifacts/reproducibility.json').write_text(json.dumps(payload, indent=2))
          PY
      - name: Upload BBH evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-bbh-frontier-evidence
          path: |
            research/sol_bbh/artifacts/**
            research/sol_bbh/bbh_frontier.py
          if-no-files-found: error
