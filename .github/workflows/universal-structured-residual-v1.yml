name: Universal Structured Residual V1

on:
  pull_request:
    branches:
      - universal-exact-closeout-v4
    paths:
      - 'research/universal_validation/bbeh_zebra_exact_v1.py'
      - 'research/universal_validation/bbeh_zebra_exact_v2.py'
      - 'research/universal_validation/test_bbeh_zebra_exact_v1.py'
      - 'research/universal_validation/bbeh_structured_residual_closeout_v1.py'
      - 'research/universal_validation/test_bbeh_structured_residual_closeout_v1.py'
      - '.github/workflows/universal-structured-residual-v1.yml'
  workflow_dispatch:

concurrency:
  group: universal-structured-residual-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-structured-residual-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet pytest z3-solver
      - name: Run unit, protocol, and metamorphic tests
        working-directory: research/universal_validation
        run: pytest -q test_bbeh_zebra_exact_v1.py test_bbeh_structured_residual_closeout_v1.py
      - name: Fetch pinned BBEH
        run: |
          mkdir -p research/universal_validation/.external
          git clone https://github.com/google-deepmind/bbeh.git research/universal_validation/.external/bbeh
          git -C research/universal_validation/.external/bbeh checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
      - name: Evaluate full BBEH zebra task
        working-directory: research/universal_validation
        env:
          BBEH_TASK_ROOT: .external/bbeh/bbeh/benchmark_tasks
        run: |
          mkdir -p artifacts/structured_residual_v1
          python bbeh_structured_residual_closeout_v1.py 2>&1 | tee artifacts/structured_residual_v1/run.log
      - name: Seal artifact hashes
        if: always()
        working-directory: research/universal_validation
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('artifacts/structured_residual_v1')
          root.mkdir(parents=True, exist_ok=True)
          payload = {
              str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in root.rglob('*') if path.is_file() and path.name != 'SHA256.json'
          }
          (root / 'SHA256.json').write_text(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-structured-residual-v1
          path: |
            research/universal_validation/artifacts/structured_residual_v1/**
            research/universal_validation/bbeh_zebra_exact_v1.py
            research/universal_validation/bbeh_zebra_exact_v2.py
            research/universal_validation/test_bbeh_zebra_exact_v1.py
            research/universal_validation/bbeh_structured_residual_closeout_v1.py
            research/universal_validation/test_bbeh_structured_residual_closeout_v1.py
          if-no-files-found: warn
