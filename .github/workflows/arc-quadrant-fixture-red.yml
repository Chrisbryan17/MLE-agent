name: ARC Quadrant Fixture Integrity RED

on:
  push:
    branches:
      - universal-core-arc-training-v2-2
    paths:
      - '.github/workflows/arc-quadrant-fixture-red.yml'

permissions:
  contents: write

jobs:
  verify-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-arc-training-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: Require fixture digest mismatch
        run: |
          set +e
          python -m pytest -q research/universal_core/holonomy_v2_2/tests/test_quadrant_mosaic_fixtures.py > /tmp/fixture-red.log 2>&1
          status=$?
          set -e
          cat /tmp/fixture-red.log
          test "$status" -ne 0
          grep -F "test_quadrant_mosaic_fixtures_match_pinned_training_payloads" /tmp/fixture-red.log
      - name: Commit fixture RED evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'schema_version': 1,
              'source_commit': os.environ['SOURCE_SHA'],
              'run_id': os.environ['RUN_ID'],
              'failure_confirmed': True,
              'root_cause': 'fixture files were manually transcribed instead of copied byte-for-byte from the pinned ARC training corpus',
              'test_command': 'python -m pytest -q research/universal_core/holonomy_v2_2/tests/test_quadrant_mosaic_fixtures.py',
              'captured_log': Path('/tmp/fixture-red.log').read_text(encoding='utf-8'),
              'public_arc_evaluation_rerun': False,
          }
          path = Path('research/universal_core/holonomy_v2_2/evidence/QUADRANT_FIXTURE_INTEGRITY_RED.json')
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/universal_core/holonomy_v2_2/evidence/QUADRANT_FIXTURE_INTEGRITY_RED.json
          git commit -m 'arc: record quadrant fixture integrity RED'
          git push origin HEAD:universal-core-arc-training-v2-2
