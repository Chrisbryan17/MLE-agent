name: Repair Universal Core V1 IR Setter

on:
  pull_request:
    branches: [universal-core-v1-design]
    types: [synchronize]
    paths:
      - '.fix-trigger/**'

permissions:
  contents: write

jobs:
  repair-ir-setter:
    if: github.event.pull_request.head.ref == 'universal-core-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact source correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/universal_core/ir.py')
          source = path.read_text(encoding='utf-8')
          old = 'object._setattr__(self, "capabilities", capabilities)'
          new = 'object.__setattr__(self, "capabilities", capabilities)'
          assert source.count(old) == 1
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          rm -rf .fix-trigger

      - name: Commit and push atomic fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/universal_core/ir.py .fix-trigger
          git commit -m 'fix: use immutable dataclass setter'
          git push origin HEAD:universal-core-v1
