name: Universal Document Schema Bootstrap

on:
  pull_request:
    branches:
      - universal-exact-closeout-v4
    paths:
      - 'research/universal_validation/document_schema_bootstrap.py'
      - '.github/workflows/universal-document-schema-bootstrap.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-structured-residual-pass-20260713
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pyarrow
      - name: Fetch and inspect document schemas
        working-directory: research/universal_validation
        run: |
          set -euxo pipefail
          python document_schema_bootstrap.py 2>&1 | tee document_schema_bootstrap.log
      - uses: actions/upload-artifact@v4
        with:
          name: universal-document-schema-bootstrap
          path: |
            research/universal_validation/artifacts/document_schema_bootstrap/**
            research/universal_validation/document_schema_bootstrap.log
          if-no-files-found: error
