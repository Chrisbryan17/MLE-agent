name: Universal Arithmetic Exact V4

on:
  pull_request:
    branches:
      - universal-shuffled-exact-v3
    paths:
      - 'research/universal_validation/bbeh_arithmetic_exact_v4.py'
      - '.github/workflows/universal-arithmetic-exact-v4.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-arithmetic-exact-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned BBEH
        run: |
          mkdir -p research/universal_validation/.external
          git clone https://github.com/google-deepmind/bbeh.git research/universal_validation/.external/bbeh
          git -C research/universal_validation/.external/bbeh checkout 80d12ca916b7158f22293fcf3144f4d3d854d4be
      - name: Evaluate exact custom arithmetic
        working-directory: research/universal_validation
        env:
          BBEH_TASK_ROOT: .external/bbeh/bbeh/benchmark_tasks
        run: |
          mkdir -p artifacts/arithmetic_exact_v4
          python -m py_compile bbeh_arithmetic_exact_v4.py
          python bbeh_arithmetic_exact_v4.py 2>&1 | tee artifacts/arithmetic_exact_v4/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: universal-arithmetic-exact-v4
          path: |
            research/universal_validation/artifacts/arithmetic_exact_v4/**
            research/universal_validation/bbeh_arithmetic_exact_v4.py
          if-no-files-found: error
