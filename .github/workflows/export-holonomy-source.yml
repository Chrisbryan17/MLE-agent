name: Export Universal Core Source

on:
  pull_request:
    branches: [universal-core-holonomy-v2]
    paths:
      - '.github/workflows/export-holonomy-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-core-holonomy-v2-1
      - name: Record source identity
        run: git rev-parse HEAD > research/universal_core/EXPORTED_HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: universal-core-source-export
          path: research/universal_core
          if-no-files-found: error
